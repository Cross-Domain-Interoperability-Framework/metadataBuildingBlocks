# Fail when a schema.yaml edit has landed without regenerating the
# artifacts built from it.
#
# This is the failure that produced a98330da3: the source said
# schema:instrument was an array, every resolvedSchema.json still said
# object, and nothing anywhere disagreed out loud. The drift lived for a
# day and was found by accident. A source edit that lands in schema.yaml
# and in nothing that validates against it is invisible precisely because
# the sources still look right.
#
# The check does not repair anything. Committing a fix on the author's
# behalf would restore byte-parity while leaving the habit intact -- and
# the artifacts here are inputs to downstream repos, so a bot-authored
# regeneration is a schema change nobody reviewed.
name: Check generated schemas are current

on:
  # Push matters as much as pull_request: a98330da3 went straight to main.
  #
  # No paths filter on push, deliberately. There used to be one, and it made
  # a red check invisible: 1e37f62e2 left instrument/resolvedSchema.json
  # stale on 2026-08-17, the check failed, and then every push for two days
  # touched nothing in the filter, so it never ran again and never
  # re-reported. A stale artifact does not stop being stale because the next
  # commit was unrelated -- the drift is a property of the tree, not of the
  # diff. Running unconditionally costs ~11 min per push to main and keeps
  # the signal in front of whoever pushed last.
  push:
    branches: [main]
  pull_request:
    paths:
      - '_sources/**/schema.yaml'
      - '_sources/**/resolvedSchema.json'
      - '_sources/**/*Schema.json'
      - 'tools/resolve_schema.py'
      - 'tools/regenerate_schema_json.py'
      - 'tools/affected_blocks.py'
      - '.github/workflows/check-schema-drift.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schema-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-drift:
    name: Regenerate and diff
    # No timeout was set until 2026-10-05; a hung job then reads as a
    # random failure rather than a slow build.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # The incremental path diffs against the base branch, so the
          # default single-commit fetch is not enough.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      # The closure logic is itself a rule that can stop working, and an
      # under-reporting closure reports success over real drift. Prove it
      # fires before trusting it to narrow anything. Costs seconds.
      # --drift-test is the one that matters: it seeds a change in a block
      # three $refs upstream and proves the closure carries it all the way
      # down. Run in CI rather than by hand, because a guard nobody exercises
      # is not a guard. ~9 s, in a copy of the tree.
      - name: Prove the affected-blocks logic still fires
        if: github.event_name == 'pull_request'
        run: python tools/affected_blocks.py --self-test --drift-test

      # A pull request regenerates only the blocks its edit can move -- a
      # block's resolved output depends on its own $ref closure and nothing
      # wider, argued and measured in the header of tools/affected_blocks.py.
      # Push to main keeps the unconditional sweep, and that backstop is
      # exactly what would catch this reasoning being wrong. Do not make
      # main incremental as well.
      - name: Decide regeneration scope
        id: scope
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "mode=all" >> "$GITHUB_OUTPUT"
            echo "Full sweep (event: ${{ github.event_name }})."
            exit 0
          fi
          git fetch --no-tags origin "${{ github.base_ref }}"
          python tools/affected_blocks.py --base "origin/${{ github.base_ref }}" \
            > "$RUNNER_TEMP/affected.txt"
          if grep -qx ALL "$RUNNER_TEMP/affected.txt"; then
            echo "mode=all" >> "$GITHUB_OUTPUT"
            echo "Full sweep: this change set can affect any block."
          elif [ ! -s "$RUNNER_TEMP/affected.txt" ]; then
            echo "mode=none" >> "$GITHUB_OUTPUT"
            echo "No changed file can move a resolved schema."
          else
            echo "mode=some" >> "$GITHUB_OUTPUT"
            echo "Affected blocks:"
            sed 's/^/  /' "$RUNNER_TEMP/affected.txt"
          fi

      # No source declares a URL $ref, so both tools run entirely offline
      # and the result depends only on the checked-out tree.
      - name: Regenerate resolved schemas (full sweep)
        if: steps.scope.outputs.mode == 'all'
        run: python tools/resolve_schema.py --all

      - name: Regenerate resolved schemas (affected blocks only)
        if: steps.scope.outputs.mode == 'some'
        run: |
          set -euo pipefail
          while read -r schema; do
            [ -n "$schema" ] || continue
            echo "::group::$schema"
            python tools/resolve_schema.py --file "$schema"
            echo "::endgroup::"
          done < "$RUNNER_TEMP/affected.txt"

      # Always the full run: 69 blocks in ~1.3 s, and it reads schema.yaml
      # rather than resolvedSchema.json, so narrowing it would buy nothing.
      # This half of the check therefore stays exhaustive on every event.
      - name: Regenerate Schema.json files
        run: python tools/regenerate_schema_json.py

      - name: Report drift
        run: |
          # Scoped to _sources: build/ is regenerated and committed by the
          # postprocess and jsonforms workflows, so it is expected to lag
          # here and is not this check's business.
          if git diff --quiet -- _sources; then
            echo "Generated schemas match their sources."
            # Say what was actually proven. On an incremental run a stale
            # artifact in a block the change set cannot reach is NOT checked
            # here; the unconditional sweep on main is what covers it.
            if [ "${{ steps.scope.outputs.mode }}" = "some" ]; then
              echo "Scope: the affected blocks listed above, plus all 69 *Schema.json."
            fi
            exit 0
          fi

          echo "::error::Generated schemas are stale. A schema.yaml was edited without regenerating what is built from it."
          echo
          echo "Files that regeneration changed:"
          git diff --name-only -- _sources | sed 's/^/  /'
          echo
          echo "To fix, from the repo root:"
          echo "  python tools/resolve_schema.py --all"
          echo "  python tools/regenerate_schema_json.py"
          echo "then commit the result. Regeneration is deterministic, so"
          echo "these are the same bytes CI just produced."
          echo
          echo "===== full diff ====="
          # Untruncated on purpose. A reviewer reading this log is deciding
          # whether the drift is a forgotten regeneration or a real
          # disagreement between a source and its artifact, and the summary
          # alone cannot tell those apart.
          git --no-pager diff -- _sources
          exit 1

      # Only reachable when the diff is clean, so this catches the other
      # half: a generated file that regeneration does not produce at all.
      - name: Check for untracked generated files
        run: |
          UNTRACKED=$(git ls-files --others --exclude-standard -- _sources)
          if [ -n "$UNTRACKED" ]; then
            echo "::error::Regeneration produced files that are not committed."
            echo "$UNTRACKED" | sed 's/^/  /'
            exit 1
          fi
          echo "No untracked generated files."
