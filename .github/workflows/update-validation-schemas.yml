name: Update validation schemas

on:
  workflow_run:
    workflows: ["Validate and process Building Blocks"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  update-validation:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    # No timeout was set until 2026-10-05; a hung job then reads as a
    # random failure rather than a slow build.
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout metadataBuildingBlocks
        uses: actions/checkout@v5
        with:
          path: bb

      - name: Checkout validation repo
        uses: actions/checkout@v5
        with:
          repository: Cross-Domain-Interoperability-Framework/validation
          path: validation
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install rdflib jsonschema

      - name: Generate CDIFDiscoverySchema.json
        run: |
          python validation/generate_validation_schema.py \
            bb/_sources/profiles/cdifCompositeProfile/CoreDiscovery/resolvedSchema.json \
            -o validation/CDIFDiscoverySchema.json \
            -t "CDIF Discovery metadata schema" \
            -d "JSON schema for validating framed JSON-LD documents that describe science datasets for the CDIF discovery profile. Combines cdifCore building block with discovery properties and @type enum constraint. Generated from CDIFDiscoveryProfile building block profile resolvedSchema.json (https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/_sources/profiles/cdifCompositeProfile/CoreDiscovery/resolvedSchema.json)." \
            -v

      - name: Generate CDIFDataDescriptionSchema.json
        run: |
          python validation/generate_validation_schema.py \
            bb/_sources/profiles/cdifCompositeProfile/DiscoveryDataDescription/resolvedSchema.json \
            -o validation/CDIFDataDescriptionSchema.json \
            -t "CDIF Data Description metadata schema" \
            -d "JSON schema for validating framed JSON-LD documents conforming to the CDIF Data Description profile (discovery + data description). Generated from CDIFDataDescriptionProfile building block profile resolvedSchema.json (https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/_sources/profiles/cdifCompositeProfile/DiscoveryDataDescription/resolvedSchema.json)." \
            -v

      - name: Generate CDIFCompleteSchema.json
        run: |
          python validation/generate_validation_schema.py \
            bb/_sources/profiles/cdifCompositeProfile/cdifComplete/resolvedSchema.json \
            -o validation/CDIFCompleteSchema.json \
            -t "CDIF Complete metadata schema" \
            -d "JSON schema for validating framed JSON-LD documents that describe science datasets for the CDIF complete profile, combining discovery metadata with data description, archive distribution, and provenance extensions. Generated from CDIFcompleteProfile building block profile resolvedSchema.json (https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/_sources/profiles/cdifCompositeProfile/cdifComplete/resolvedSchema.json)." \
            -v

      - name: Generate CDIF-Discovery-Shapes.ttl
        run: |
          python validation/ShaclValidation/generate_shacl_shapes.py \
            --profile discovery \
            --bb-dir bb/_sources \
            --output validation/ShaclValidation/CDIF-Discovery-Shapes.ttl \
            -v

      - name: Generate CDIF-Complete-Shapes.ttl
        run: |
          python validation/ShaclValidation/generate_shacl_shapes.py \
            --profile complete \
            --bb-dir bb/_sources \
            --output validation/ShaclValidation/CDIF-Complete-Shapes.ttl \
            -v

      - name: Generate CDIF-DataDescription-Shapes.ttl
        run: |
          python validation/ShaclValidation/generate_shacl_shapes.py \
            --profile data_description \
            --bb-dir bb/_sources \
            --output validation/ShaclValidation/CDIF-DataDescription-Shapes.ttl \
            -v

      - name: Generate CDIF-DataStructure-Shapes.ttl
        run: |
          python validation/ShaclValidation/generate_shacl_shapes.py \
            --profile data_structure \
            --bb-dir bb/_sources \
            --output validation/ShaclValidation/CDIF-DataStructure-Shapes.ttl \
            -v

      - name: Generate CDIF-Provenance-Shapes.ttl
        run: |
          python validation/ShaclValidation/generate_shacl_shapes.py \
            --profile provenance \
            --bb-dir bb/_sources \
            --output validation/ShaclValidation/CDIF-Provenance-Shapes.ttl \
            -v

      - name: Generate CDIF-Manifest-Shapes.ttl
        run: |
          python validation/ShaclValidation/generate_shacl_shapes.py \
            --profile manifest \
            --bb-dir bb/_sources \
            --output validation/ShaclValidation/CDIF-Manifest-Shapes.ttl \
            -v

      - name: Check every generated artifact exists and is non-empty
        working-directory: validation
        run: |
          # A generator that writes nothing leaves the previous file in place, so the run has
          # "no changes" and reports success. One that writes an empty file commits the emptiness.
          # Neither is distinguishable from a correct run downstream, so assert here.
          fail=0
          for f in CDIFDiscoverySchema.json CDIFDataDescriptionSchema.json CDIFCompleteSchema.json ShaclValidation/CDIF-Discovery-Shapes.ttl ShaclValidation/CDIF-Complete-Shapes.ttl ShaclValidation/CDIF-DataDescription-Shapes.ttl ShaclValidation/CDIF-DataStructure-Shapes.ttl ShaclValidation/CDIF-Provenance-Shapes.ttl ShaclValidation/CDIF-Manifest-Shapes.ttl; do
            if [ ! -s "$f" ]; then
              echo "::error file=$f::missing or empty after generation"
              fail=1
            fi
          done
          exit $fail

      - name: Commit and push to validation repo
        working-directory: validation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.VALIDATION_REPO_PAT }}@github.com/Cross-Domain-Interoperability-Framework/validation.git

          # Prove the credential on EVERY run, including runs with nothing to push.
          # Until 2026-10-07 the push lived inside the `if there are changes` branch, so a run with
          # no changes never touched VALIDATION_REPO_PAT and still concluded success. An expired
          # token would therefore have stayed invisible until the next run that happened to carry a
          # change -- and the artifacts it ships are the normative schemas and SHACL shapes the
          # release repos consume, so the gap is silent on both sides. A no-op push still
          # authenticates against the remote, which is exactly what makes it a usable probe.
          if ! git push --dry-run origin HEAD:main; then
            echo "::error::cannot push to validation -- VALIDATION_REPO_PAT is missing, expired, or lacks contents:write"
            exit 1
          fi

          git add CDIFDiscoverySchema.json CDIFDataDescriptionSchema.json CDIFCompleteSchema.json ShaclValidation/CDIF-Discovery-Shapes.ttl ShaclValidation/CDIF-Complete-Shapes.ttl ShaclValidation/CDIF-DataDescription-Shapes.ttl ShaclValidation/CDIF-DataStructure-Shapes.ttl ShaclValidation/CDIF-Provenance-Shapes.ttl ShaclValidation/CDIF-Manifest-Shapes.ttl

          if git diff --cached --quiet; then
            echo "NO CHANGES -- remote authenticated and writable, nothing to update"
            echo "Outcome: **no changes**; remote verified writable." >> "$GITHUB_STEP_SUMMARY"
          else
            changed=$(git diff --cached --name-only | wc -l)
            git commit -m "Update validation schemas and SHACL shapes from building blocks [automated]"
            git push
            echo "PUSHED $changed file(s)"
            echo "Outcome: **pushed $changed file(s)** to validation." >> "$GITHUB_STEP_SUMMARY"
            git show --name-only --format='' HEAD | sed 's|^|  - |' >> "$GITHUB_STEP_SUMMARY" || true
          fi
