# Fail when a release repo's generated artifacts have drifted from the
# building blocks they are generated from.
#
# tools/sync_release_repos.py is manual and dry-run by default, and nothing
# invokes it. In August 2026 that let nine of the eleven release repos fall
# roughly two weeks behind mBB -- missing the schema:inDefinedTermSet
# widening, the schema:instrument array form, and
# cdif:isDefinedBy_RepresentedVariable -- with nothing anywhere going red.
# The gap only surfaced because someone asked. This closes that.
#
# It reports and stops. It does not sync: the release branches are being
# prepared for a locked release, and a bot-authored schema change to a
# profile under review is not something anyone asked for.
#
# It compares against each release repo's `updates` branch, where syncs
# land, not `main`. Since the 2026-09-10 release model, `main` is the
# published release and moves only when a release is cut, so it lags mBB by
# design between releases. Compared against `main`, this check was red on
# every run from 2026-09-11 to 2026-10-26 while `updates` matched mBB
# exactly -- a permanent red that could not show a missed sync. Whether
# `updates` is ready to release is a separate decision; to see what a
# release would carry, dispatch this workflow with release_branch: main.
name: Check release repos match building blocks

on:
  push:
    branches: [main]
    paths:
      - '_sources/profiles/**'
      - 'tools/sync_release_repos.py'
      - '.github/workflows/check-release-drift.yml'
  workflow_dispatch:
    inputs:
      release_branch:
        description: 'Release-repo branch to compare against: updates (synced work) or main (the published release). profile-provenance and XAS-CDIF are pinned separately.'
        required: false
        default: 'updates'
  schedule:
    # Weekly. The push trigger catches drift this repo causes; the schedule
    # catches drift a release repo causes by editing a generated file, which
    # no event here can observe.
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: release-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-release-drift:
    name: Compare release artifacts
    # No timeout was set until 2026-10-05; a hung job then reads as a
    # random failure rather than a slow build.
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout metadataBuildingBlocks
        uses: actions/checkout@v5
        with:
          path: cdif/metadataBuildingBlocks

      - name: Checkout doc-corediscovery
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/doc-corediscovery
          ref: ${{ inputs.release_branch || 'updates' }}
          path: cdif/doc-corediscovery

      - name: Checkout doc-discoverydatadescription
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/doc-discoverydatadescription
          ref: ${{ inputs.release_branch || 'updates' }}
          path: cdif/doc-discoverydatadescription

      - name: Checkout doc-discoverydatadescriptionstructure
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/doc-discoverydatadescriptionstructure
          ref: ${{ inputs.release_branch || 'updates' }}
          path: cdif/doc-discoverydatadescriptionstructure

      - name: Checkout profile-codelist
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/profile-codelist
          ref: ${{ inputs.release_branch || 'updates' }}
          path: cdif/profile-codelist

      - name: Checkout profile-conceptscheme
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/profile-conceptscheme
          ref: ${{ inputs.release_branch || 'updates' }}
          path: cdif/profile-conceptscheme

      - name: Checkout profile-core
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/profile-core
          ref: ${{ inputs.release_branch || 'updates' }}
          path: cdif/profile-core

      - name: Checkout profile-datadescription
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/profile-datadescription
          ref: ${{ inputs.release_branch || 'updates' }}
          path: cdif/profile-datadescription

      - name: Checkout profile-discovery
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/profile-discovery
          ref: ${{ inputs.release_branch || 'updates' }}
          path: cdif/profile-discovery

      - name: Checkout profile-datastructure
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/profile-datastructure
          ref: ${{ inputs.release_branch || 'updates' }}
          path: cdif/profile-datastructure

      - name: Checkout profile-manifest
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/profile-manifest
          ref: ${{ inputs.release_branch || 'updates' }}
          path: cdif/profile-manifest

      - name: Checkout profile-provenance
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/profile-provenance
          # Pinned, not following release_branch: profile-provenance is still in
          # review. It has no v1.1.0, its main is the pre-release state, and its
          # reviewRevision202606 branch still exists -- the only one of the eleven
          # that was not renamed to archive202609 on 2026-09-10. Move it to main
          # when it is released.
          ref: 'reviewRevision202606'
          path: cdif/profile-provenance

      - name: Checkout profile-access
        uses: actions/checkout@v5
        with:
          # Pinned like profile-provenance: a draft under review, published as
          # profile-access-draft with only a main branch. Checked out under the
          # name sync_release_repos.py uses for the local clone.
          repository: ${{ github.repository_owner }}/profile-access-draft
          ref: 'main'
          path: cdif/profile-access

      - name: Checkout XAS-CDIF
        uses: actions/checkout@v5
        # A failed checkout aborts the job before the comparison runs, which is
        # how a missing XAS-CDIF produced a traceback and no report at all.
        # Degrade instead: sync_release_repos.py reports the repo as MISSING and
        # still exits 1, so the gap is named rather than fatal.
        continue-on-error: true
        with:
          # NOT ${{ github.repository_owner }}: unlike the eleven profile/doc
          # repos, XAS-CDIF lives under smrgeoinfo, not the CDIF org. The
          # org path 404s, which fails the checkout and the whole job.
          # It is public, so no token is needed.
          repository: smrgeoinfo/XAS-CDIF
          # Pinned rather than following release_branch, like profile-provenance:
          # XAS-CDIF has no v1.1 release line, its publishable artifacts live
          # under release/ rather than the repo root, and its Pages is served
          # from gh-pages. It was added to sync_release_repos.py's table on
          # 2026-09-08 but never given a checkout step here, so every run since
          # raised FileNotFoundError on its examples directory and reported
          # nothing at all.
          #
          # The pin was 'cdifxasRelease1.1' until that branch was renamed
          # 'updates' upstream, adopting the convention the other repos use.
          # The last green run (2026-10-26 23:02) still fetched the old name;
          # every run after it reported XAS-CDIF as MISSING and exited 1. A pin
          # here cannot see a rename there, so keep this value and the branch
          # names in `git ls-remote --heads https://github.com/smrgeoinfo/XAS-CDIF`
          # in step whenever one moves -- and note the degradation above is what
          # surfaced this, by naming the gap instead of reporting success for a
          # repo it never compared.
          ref: 'updates'
          path: cdif/XAS-CDIF

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # pyshacl/rdflib are needed because the comparison regenerates each
      # profile's merged SHACL bundle via validate_shacl.py --emit-shapes.
      - name: Install dependencies
        run: pip install pyyaml jsonschema pyshacl

      # sync_release_repos.py resolves release repos as siblings of the mBB
      # checkout, which is why everything lands under cdif/.
      - name: Compare release repos against building blocks
        working-directory: cdif/metadataBuildingBlocks
        run: python tools/sync_release_repos.py --check
