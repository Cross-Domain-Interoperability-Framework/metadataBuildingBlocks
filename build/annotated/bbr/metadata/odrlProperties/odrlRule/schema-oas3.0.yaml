  cdif.bbr.metadata.odrlProperties.odrlConstraint:
    title: ODRL Constraint
    description: An ODRL 2.2 Constraint (https://www.w3.org/TR/odrl-model/#constraint)
      or LogicalConstraint (https://www.w3.org/TR/odrl-model/#constraint-logical).
      A Constraint compares a left operand with a right operand using an operator,
      e.g. odrl:spatial odrl:eq <country>. A LogicalConstraint combines constraints
      with exactly one of odrl:and, odrl:or, odrl:xone or odrl:andSequence. Operands
      and operators are open IRIs (odrlTerms), so ODRL profile terms validate.
    type: object
    properties:
      '@context':
        type: object
        description: JSON-LD namespace prefixes for ODRL properties.
        properties:
          odrl:
            enum:
            - http://www.w3.org/ns/odrl/2/
    anyOf:
    - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/odrlProperties/odrlRule/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.odrlProperties.odrlConstraint/$defs/Constraint
    - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/odrlProperties/odrlRule/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.odrlProperties.odrlConstraint/$defs/LogicalConstraint
    $defs:
      Constraint:
        type: object
        properties:
          '@id':
            description: Optional; needed when a LogicalConstraint refers to this
              constraint by reference.
            type: string
            format: iri
          '@type':
            type: array
            items:
              type: string
            contains:
              enum:
              - odrl:Constraint
          odrl:leftOperand:
            x-jsonld-id: http://www.w3.org/ns/odrl/2/leftOperand
            allOf:
            - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/odrlProperties/odrlRule/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.odrlProperties.odrlTerms/$defs/LeftOperand
          odrl:operator:
            x-jsonld-id: http://www.w3.org/ns/odrl/2/operator
            allOf:
            - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/odrlProperties/odrlRule/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.odrlProperties.odrlTerms/$defs/Operator
          odrl:rightOperand:
            description: A literal, a value object ({"@value", "@type"}) or an {@id}
              reference.
            x-jsonld-id: http://www.w3.org/ns/odrl/2/rightOperand
          odrl:rightOperandReference:
            description: An IRI whose dereferenced value is the right operand.
            x-jsonld-id: http://www.w3.org/ns/odrl/2/rightOperandReference
            allOf:
            - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/odrlProperties/odrlRule/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.cdifDataType.objectReference
          odrl:dataType:
            description: Datatype of the right operand, e.g. xsd:decimal.
            x-jsonld-id: http://www.w3.org/ns/odrl/2/dataType
            allOf:
            - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/odrlProperties/odrlRule/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.cdifDataType.objectReference
          odrl:unit:
            description: Unit of the right operand, e.g. a currency or unit of measure.
            x-jsonld-id: http://www.w3.org/ns/odrl/2/unit
            allOf:
            - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/odrlProperties/odrlRule/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.cdifDataType.objectReference
          odrl:status:
            description: The current value of the left operand, for comparison with
              the right operand.
            x-jsonld-id: http://www.w3.org/ns/odrl/2/status
        required:
        - odrl:leftOperand
        - odrl:operator
        anyOf:
        - required:
          - odrl:rightOperand
        - required:
          - odrl:rightOperandReference
      LogicalConstraint:
        type: object
        properties:
          '@id':
            type: string
            format: iri
          '@type':
            type: array
            items:
              type: string
            contains:
              enum:
              - odrl:LogicalConstraint
          odrl:and:
            description: All of the constraints must be satisfied.
            x-jsonld-id: http://www.w3.org/ns/odrl/2/and
            allOf:
            - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/odrlProperties/odrlRule/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.odrlProperties.odrlConstraint/$defs/constraintList
          odrl:or:
            description: At least one of the constraints must be satisfied.
            x-jsonld-id: http://www.w3.org/ns/odrl/2/or
            allOf:
            - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/odrlProperties/odrlRule/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.odrlProperties.odrlConstraint/$defs/constraintList
          odrl:xone:
            description: Exactly one of the constraints must be satisfied.
            x-jsonld-id: http://www.w3.org/ns/odrl/2/xone
            allOf:
            - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/odrlProperties/odrlRule/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.odrlProperties.odrlConstraint/$defs/constraintList
          odrl:andSequence:
            description: All of the constraints must be satisfied, in order.
            x-jsonld-id: http://www.w3.org/ns/odrl/2/andSequence
            allOf:
            - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/odrlProperties/odrlRule/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.odrlProperties.odrlConstraint/$defs/constraintList
        oneOf:
        - required:
          - odrl:and
        - required:
          - odrl:or
        - required:
          - odrl:xone
        - required:
          - odrl:andSequence
      constraintList:
        description: 'The operand constraints, as an RDF list ({"@list": [...]}),
          each inline or an {@id} reference.'
        type: object
        properties:
          '@list':
            type: array
            minItems: 1
            items:
              anyOf:
              - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/odrlProperties/odrlRule/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.cdifDataType.objectReference
              - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/odrlProperties/odrlRule/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.odrlProperties.odrlConstraint/$defs/Constraint
        required:
        - '@list'
    x-jsonld-prefixes:
      odrl: http://www.w3.org/ns/odrl/2/
    x-bblocks-metadata:
      itemIdentifier: cdif.bbr.metadata.odrlProperties.odrlConstraint
      register: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/register.json
      version: '0.1'
      dateOfLastChange: '2026-10-28'
    x-schema-source: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/odrlProperties/odrlConstraint/schema.yaml
    x-schema-version: https://json-schema.org/draft/2020-12/schema
  cdif.bbr.metadata.schemaorgProperties.person:
    description: schema for cdif profile of schema.org/Person
    type: object
    properties:
      '@id':
        type: string
      '@type':
        type: array
        items:
          type: string
        contains:
          enum:
          - schema:Person
        minItems: 1
      schema:name:
        type: string
        description: string label for person that is meaningful for human users, should
          format consistently. Recommend 'Family Name, Given name' format.
        x-jsonld-id: http://schema.org/name
      schema:description:
        type: string
        description: additional information about the agent or their relation to the
          described resource
        x-jsonld-id: http://schema.org/description
      schema:identifier:
        description: identifier for person, recommend ORCID
        anyOf:
        - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/odrlProperties/odrlRule/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.schemaorgProperties.identifier
        - type: string
        x-jsonld-id: http://schema.org/identifier
      schema:alternateName:
        type: string
        description: other labels by which the person might be known
        x-jsonld-id: http://schema.org/alternateName
      schema:affiliation:
        description: if affiliation is present, value must be a schema:Organization.
        x-jsonld-id: http://schema.org/affiliation
        allOf:
        - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/odrlProperties/odrlRule/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.schemaorgProperties.organization
      schema:contactPoint:
        type: object
        description: An email address or a contact web page (a form, an issue tracker),
          or both; at least one is required. Schema.org also allows telephone and
          postal contacts. A URL-only contact is ordinary in DCAT (a vcard:Kind with
          only vcard:hasURL), so requiring email made such records invalid.
        properties:
          '@type':
            default:
            - schema:ContactPoint
            type: array
            items:
              type: string
            contains:
              enum:
              - schema:ContactPoint
            minItems: 1
          schema:email:
            type: string
            x-jsonld-id: http://schema.org/email
          schema:url:
            type: string
            format: uri
            x-jsonld-id: http://schema.org/url
        required:
        - '@type'
        anyOf:
        - required:
          - schema:email
        - required:
          - schema:url
        x-jsonld-id: http://schema.org/contactPoint
      schema:sameAs:
        type: array
        description: other identifiers for the person
        items:
          anyOf:
          - type: string
          - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/odrlProperties/odrlRule/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.cdifDataType.objectReference
        x-jsonld-id: http://schema.org/sameAs
    allOf:
    - required:
      - '@type'
    - anyOf:
      - required:
        - schema:name
      - required:
        - schema:identifier
    x-jsonld-prefixes:
      schema: http://schema.org/
    x-bblocks-metadata:
      itemIdentifier: cdif.bbr.metadata.schemaorgProperties.person
      register: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/register.json
      version: '0.1'
      dateOfLastChange: '2026-10-28'
    x-schema-source: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/schemaorgProperties/person/schema.yaml
    x-schema-version: https://json-schema.org/draft/2020-12/schema
  cdif.bbr.metadata.schemaorgProperties.organization:
    type: object
    properties:
      '@id':
        type: string
      '@type':
        default:
        - schema:Organization
        type: array
        items:
          anyOf:
          - type: string
            enum:
            - schema:Organization
            - schema:FundingAgency
