            - odrl:relativeSpatialPosition
            - odrl:relativeTemporalPosition
            - odrl:resolution
            - odrl:spatial
            - odrl:spatialCoordinates
            - odrl:systemDevice
            - odrl:timeInterval
            - odrl:unitOfCount
            - odrl:version
            - odrl:virtualLocation
        required:
        - '@id'
        additionalProperties: false
      Operator:
        description: 'Reference to an ODRL Operator operator. Open: any IRI is accepted,
          so ODRL profile terms (e.g. cdifa1:) validate; the examples list the 12
          non-deprecated ODRL 2.2 Operator terms.'
        type: object
        properties:
          '@id':
            type: string
