    - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/odrlProperties/odrlRule/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.odrlProperties.odrlParty/$defs/PartyCollection
    $defs:
      Party:
        description: Typed odrl:Party, schema:Person or schema:Organization. ODRL
          declares odrl:Party a subclass of schema:Person or schema:Organization (among
          FOAF and vCard classes), and gives odrl:assigner and odrl:assignee the range
          odrl:Party, so a schema.org-typed node in those roles is an odrl:Party without
          saying so. A schema:Person is validated by the person block and a schema:Organization
          by the organization block. A person may also carry odrl:Party; an organization
          may not, because the organization block only accepts schema.org organization
          types in @type.
        type: object
        properties:
          '@type':
            type: array
            items:
              type: string
          '@id':
            type: string
            format: iri
        required:
        - '@type'
        - '@id'
        anyOf:
        - properties:
            '@type':
              contains:
                enum:
                - odrl:Party
        - properties:
            '@type':
              contains:
                enum:
                - schema:Person
        - properties:
            '@type':
              contains:
                enum:
                - schema:Organization
        allOf:
        - if:
            properties:
              '@type':
                contains:
                  enum:
                  - schema:Person
          then:
            $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/odrlProperties/odrlRule/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.schemaorgProperties.person
        - if:
            properties:
              '@type':
                contains:
                  enum:
                  - schema:Organization
          then:
            $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/odrlProperties/odrlRule/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.schemaorgProperties.organization
      PartyCollection:
        description: Per ODRL, a refined collection is identified through odrl:source,
          so odrl:refinement requires odrl:source.
        type: object
        properties:
          '@type':
            type: array
            items:
              type: string
            contains:
              enum:
              - odrl:PartyCollection
          '@id':
            type: string
            format: iri
          odrl:source:
            description: The collection this one is drawn from.
            x-jsonld-id: http://www.w3.org/ns/odrl/2/source
            allOf:
            - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/odrlProperties/odrlRule/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.cdifDataType.objectReference
          odrl:refinement:
            description: Constraints selecting the members of odrl:source that belong
