  cdif.bbr.metadata.odrlProperties.odrlParty:
    title: ODRL Party
    description: 'An ODRL 2.2 Party (https://www.w3.org/TR/odrl-model/#party) or PartyCollection
      (https://www.w3.org/TR/odrl-model/#party-collection): who takes a role (assigner,
      assignee) in a rule. A Party is a person, organization or agent identified by
      its IRI. A PartyCollection is a group of parties: either the collection itself,
      identified by @id, or a subset of one, where odrl:source names the collection
      and odrl:refinement narrows it (e.g. registered users located in the UK).'
    type: object
    properties:
      '@context':
        type: object
        description: JSON-LD namespace prefixes for ODRL and schema.org properties.
        properties:
          odrl:
            enum:
            - http://www.w3.org/ns/odrl/2/
          schema:
            enum:
            - http://schema.org/
