title: ODRL Rule
description: 'An ODRL 2.2 Rule (https://www.w3.org/TR/odrl-model/#rule): a Permission
  (may do), a Prohibition (must not do) or a Duty (must do). Every rule has one action
  and may name its target asset, the parties (assigner, assignee) and constraints.
  Target and parties may instead be given once at policy level (odrlPolicy), so only
  the action is required here. A Permission may carry duties that must be fulfilled
  to exercise it, a Prohibition remedies owed if it is broken, and a Duty consequences
  owed if it is not fulfilled.'
type: object
properties:
  '@context':
    type: object
    description: JSON-LD namespace prefixes for ODRL properties.
    properties:
      odrl:
        enum:
        - http://www.w3.org/ns/odrl/2/
anyOf:
- $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/odrlProperties/odrlRule/schema-oas3.0.yaml#/$defs/Permission
- $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/odrlProperties/odrlRule/schema-oas3.0.yaml#/$defs/Prohibition
- $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/odrlProperties/odrlRule/schema-oas3.0.yaml#/$defs/Duty
$defs:
