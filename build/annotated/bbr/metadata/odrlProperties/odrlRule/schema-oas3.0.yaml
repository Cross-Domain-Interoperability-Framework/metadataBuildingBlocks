            - odrl:derive
            - odrl:digitize
            - odrl:display
            - odrl:distribute
            - odrl:ensureExclusivity
            - odrl:execute
            - odrl:extract
            - odrl:give
            - odrl:grantUse
            - odrl:include
            - odrl:index
