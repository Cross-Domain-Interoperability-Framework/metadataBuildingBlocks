        allOf:
        - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/odrlProperties/odrlRule/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.odrlProperties.odrlAction
      odrl:assigner:
