      LeftOperand:
        description: 'Reference to an ODRL LeftOperand left operand. Open: any IRI
          is accepted, so ODRL profile terms (e.g. cdifa1:) validate; the examples
          list the 32 non-deprecated ODRL 2.2 LeftOperand terms.'
        type: object
        properties:
          '@id':
            type: string
            examples:
            - odrl:absolutePosition
            - odrl:absoluteSize
            - odrl:absoluteSpatialPosition
            - odrl:absoluteTemporalPosition
            - odrl:count
            - odrl:dateTime
