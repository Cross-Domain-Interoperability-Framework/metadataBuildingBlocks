      RightOperand:
        description: 'Reference to an ODRL RightOperand right operand. Open: any IRI
          is accepted, so ODRL profile terms (e.g. cdifa1:) validate; the examples
          list the 1 non-deprecated ODRL 2.2 RightOperand terms. Most right operands
