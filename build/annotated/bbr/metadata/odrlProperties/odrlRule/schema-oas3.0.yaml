            type: array
            minItems: 1
            items:
              $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/odrlProperties/odrlRule/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.odrlProperties.odrlConstraint
            x-jsonld-id: http://www.w3.org/ns/odrl/2/refinement
        required:
        - '@type'
        anyOf:
        - required:
          - '@id'
        - required:
          - odrl:source
        dependentRequired:
          odrl:refinement:
          - odrl:source
    x-jsonld-prefixes:
      odrl: http://www.w3.org/ns/odrl/2/
      schema: http://schema.org/
    x-bblocks-metadata:
      itemIdentifier: cdif.bbr.metadata.odrlProperties.odrlParty
      register: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/register.json
