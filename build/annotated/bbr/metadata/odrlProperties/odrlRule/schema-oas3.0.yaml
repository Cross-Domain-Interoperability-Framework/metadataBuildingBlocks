    - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/odrlProperties/odrlRule/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.odrlProperties.odrlAsset
  PartyRef:
    description: A party, as a reference or a Party or PartyCollection node.
    anyOf:
