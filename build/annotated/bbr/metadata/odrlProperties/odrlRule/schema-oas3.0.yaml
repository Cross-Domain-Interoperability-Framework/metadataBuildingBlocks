            - odrl:play
            - odrl:present
            - odrl:print
            - odrl:read
            - odrl:reproduce
            - odrl:reviewPolicy
            - odrl:sell
            - odrl:stream
            - odrl:synchronize
            - odrl:textToSpeech
            - odrl:transfer
            - odrl:transform
            - odrl:translate
            - odrl:uninstall
            - odrl:use
            - odrl:watermark
