          identifier for the identifier schema, e.g. DOI, ARK.  Get values from https://registry.identifiers.org/registry/
          for interoperability. URI-shape values MUST be serialized as JSON-LD IRI
          references ({"@id":"..."}) so they participate in RDF entailment; free-label
          strings remain valid as strings.
