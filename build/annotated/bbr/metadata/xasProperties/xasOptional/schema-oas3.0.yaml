  cdif.bbr.metadata.cdifDataType.cdifInstanceVariable:
    title: CDIF Instance Variable
    type: object
    properties:
      '@type':
        type: array
        description: Must include both schema:PropertyValue and cdi:InstanceVariable.
          Additional types may be included.
        items:
          type: string
        contains:
          enum:
          - cdi:InstanceVariable
      cdif:physicalDataType:
        description: identifier or name for the data type concept.
        x-jsonld-id: https://w3id.org/cdif/physicalDataType
        allOf:
        - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/xasProperties/xasOptional/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.cdifDataType.cdifInstanceVariable/$defs/cdifConceptOrTermOrString
      cdif:role:
        type: string
        enum:
        - UnitIdentifier
        - Measure
        - Attribute
        - Dimension
        - Descriptor
        - ReferenceVariable
        description: Specifies the role this variable plays in a data structure. UnitIdentifier
          names the unit a row describes; Measure holds observed/derived values; Attribute
          qualifies an observation; Dimension addresses a cell in a multi-dimensional
          cube; Descriptor names the variable that a Reference column records values
          for (long format); ReferenceVariable holds those recorded values.
        x-jsonld-id: https://w3id.org/cdif/role
      cdif:simpleUnitOfMeasure:
        description: The unit in which the data values are measured (kg, pound, euro),
          expressed as a simple string, in cases where no additional information is
          available (in the legacy system) or needed (as in the case of broad agreement
          within the community of use [i.e., ISO country codes, currencies, etc. in
          SDMX])
        type: string
        x-jsonld-id: https://w3id.org/cdif/simpleUnitOfMeasure
      cdif:uses:
        type: array
        items:
          $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/xasProperties/xasOptional/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.cdifDataType.cdifInstanceVariable/$defs/cdifConceptOrTermOrString
        description: Essentially the same as schema:propertyID. References to the
          concept(s) that this variable measures or represents. Concepts only -- to
          point at the RepresentedVariable that supplies the represented-variable-level
          properties, use cdif:isDefinedBy_RepresentedVariable. Splitting the two
          targets follows the CDIF convention of disambiguating the polymorphic DDI-CDI
          role names by target, so each JSON key has a single value type; it also
          keeps cdif:uses type-compatible with canonical cdi:uses on InstanceVariable,
          which is valued by a Concept.
        x-jsonld-id: https://w3id.org/cdif/uses
      cdif:isDefinedBy_RepresentedVariable:
        description: 'The RepresentedVariable this InstanceVariable instantiates.
          A reference only (@id, nothing else): the point of the link is that the
          represented-variable-level properties are defined once on the RepresentedVariable
          and NOT duplicated here, so an inline copy would defeat it. Same property
          name as on cdifDataStructureComponent, which carries the equivalent link
          within a data structure; that one also accepts an inline RepresentedVariable
          because a structure may define one that exists nowhere else.'
        x-jsonld-id: https://w3id.org/cdif/isDefinedBy_RepresentedVariable
        allOf:
        - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/xasProperties/xasOptional/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.cdifDataType.objectReference
      cdi:function:
        type: array
        items:
          $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/xasProperties/xasOptional/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.cdifDataType.cdifInstanceVariable/$defs/cdifConceptOrTermOrString
        description: Immutable characteristic of the variable such as geographic designator,
          weight, temporal designation, etc. (InstanceVariable.function).
        x-jsonld-id: http://ddialliance.org/Specification/DDI-CDI/1.0/RDF/function
      cdi:platformType:
        description: The application or technical system context in which the variable
          has been realized - typically a statistical processing package or processing
          environment (InstanceVariable.platformType).
        x-jsonld-id: http://ddialliance.org/Specification/DDI-CDI/1.0/RDF/platformType
        allOf:
        - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/xasProperties/xasOptional/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.cdifDataType.cdifInstanceVariable/$defs/cdifConceptOrTermOrString
      cdi:source:
        anyOf:
        - type: string
        - type: object
          required:
          - '@id'
          additionalProperties: false
          properties:
            '@id':
              type: string
        description: Reference capturing provenance information for this InstanceVariable
          (InstanceVariable.source).
        x-jsonld-id: http://ddialliance.org/Specification/DDI-CDI/1.0/RDF/source
      cdif:isDescribedBy_StatisticsCollection:
        description: "The StatisticsCollection holding summary / category statistics
          for this InstanceVariable (direct JSON mapping of the DDI-CDI `InstanceVariable.isDescribedBy
          \u2192 StatisticsCollection` association). cdif: namespaced and target-suffixed
          because the DDI-CDI isDescribedBy association is polymorphic. This is the
          canonical CDIF path for **per-variable** statistics; dataset-scope aggregates
          (row count etc.) go under `Dataset.cdif:statistics` instead."
        anyOf:
        - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/xasProperties/xasOptional/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.cdifDataType.cdifStatistics/$defs/StatisticsCollection
        - type: object
          additionalProperties: false
          properties:
            '@id':
              type: string
          required:
          - '@id'
        x-jsonld-id: https://w3id.org/cdif/isDescribedBy_StatisticsCollection
      cdi:describedUnitOfMeasure:
        description: The unit in which the data values are measured, expressed as
          a controlled-vocabulary entry (RepresentedVariable.describedUnitOfMeasure).
          For a plain-string unit, use cdif:simpleUnitOfMeasure instead.
        x-jsonld-id: http://ddialliance.org/Specification/DDI-CDI/1.0/RDF/describedUnitOfMeasure
        allOf:
        - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/xasProperties/xasOptional/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.cdifDataType.cdifInstanceVariable/$defs/cdifConceptOrTerm
      cdi:qualifies:
        type: object
        required:
        - '@id'
        additionalProperties: false
        properties:
          '@id':
            type: string
        description: reference to an instance variable defined for this dataset
        x-jsonld-id: http://ddialliance.org/Specification/DDI-CDI/1.0/RDF/qualifies
    allOf:
    - required:
      - '@type'
    - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/xasProperties/xasOptional/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.schemaorgProperties.variableMeasured
    - if:
        required:
        - cdif:isDefinedBy_RepresentedVariable
      then:
        properties:
          cdi:takesSubstantiveValuesFrom:
            not: true
            x-jsonld-id: http://ddialliance.org/Specification/DDI-CDI/1.0/RDF/takesSubstantiveValuesFrom
          cdi:takesSentinelValuesFrom:
            not: true
            x-jsonld-id: http://ddialliance.org/Specification/DDI-CDI/1.0/RDF/takesSentinelValuesFrom
          cdi:hasIntendedDataType:
            not: true
            x-jsonld-id: http://ddialliance.org/Specification/DDI-CDI/1.0/RDF/hasIntendedDataType
          cdi:describedUnitOfMeasure:
            not: true
            x-jsonld-id: http://ddialliance.org/Specification/DDI-CDI/1.0/RDF/describedUnitOfMeasure
          cdi:unitOfMeasureKind:
            not: true
            x-jsonld-id: http://ddialliance.org/Specification/DDI-CDI/1.0/RDF/unitOfMeasureKind
          cdi:measures:
            not: true
            x-jsonld-id: http://ddialliance.org/Specification/DDI-CDI/1.0/RDF/measures
          cdi:externalDefinition:
            not: true
            x-jsonld-id: http://ddialliance.org/Specification/DDI-CDI/1.0/RDF/externalDefinition
          cdif:uses_Concept:
            not: true
            x-jsonld-id: https://w3id.org/cdif/uses_Concept
          cdif:definition:
            not: true
            x-jsonld-id: https://w3id.org/cdif/definition
        description: When cdif:isDefinedBy_RepresentedVariable is present, the represented-variable-level
          properties live on that RepresentedVariable and may not be declared inline
          on the InstanceVariable.
    $defs:
      cdifConceptOrTermOrString:
        $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/xasProperties/xasOptional/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.cdifDataType.cdifConceptOrTermOrString
      cdifConceptOrTerm:
        $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/xasProperties/xasOptional/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.cdifDataType.cdifConceptOrTerm
    x-jsonld-prefixes:
      cdif: https://w3id.org/cdif/
      schema: http://schema.org/
      spdx: http://spdx.org/rdf/terms#
      cdi: http://ddialliance.org/Specification/DDI-CDI/1.0/RDF/
      skos: http://www.w3.org/2004/02/skos/core#
      xas: https://w3id.org/cdif/xas/
      nxs: https://manual.nexusformat.org/classes/
      prov: http://www.w3.org/ns/prov#
    x-schema-source: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/cdifDataType/cdifInstanceVariable/schema.yaml
    x-schema-version: https://json-schema.org/draft/2020-12/schema
  cdif.bbr.metadata.schemaorgProperties.definedTerm:
    description: "schema.org Defined Term schema.\n\n**Union-type policy:** In CDIF
      profile UML models an attribute typed as\nschema:DefinedTerm is represented
      by a single attribute of that class type.\nThe JSON Schema implementation permits
      the property value to be EITHER a\nplain string (interpreted as schema:name
      or schema:termCode in the default\nvocabulary) OR a full schema:DefinedTerm
      object (with explicit @type, name,\nidentifier, termCode, inDefinedTermSet).
      Consumers should accept either form.\n\nNote that this differs from the cdif
      Concept policy: a Concept (skos:Concept)\nin CDIF profiles MUST be a controlled-vocabulary
      entry (object form or\n@id-reference) \u2014 plain strings are not permitted
      for Concept-typed values\nbecause vocabulary identity cannot be recovered from
      an unscoped label.\n"
    type: object
    properties:
      '@type':
        type: array
        items:
          type: string
        contains:
          enum:
          - schema:DefinedTerm
        minItems: 1
      schema:name:
        type: string
        description: text label for the term that is useful to human user
        x-jsonld-id: http://schema.org/name
      schema:identifier:
        anyOf:
        - type: string
        - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/xasProperties/xasOptional/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.schemaorgProperties.identifier
        x-jsonld-id: http://schema.org/identifier
      schema:inDefinedTermSet:
        description: 'The controlled vocabulary responsible for this keyword, as EITHER
          a plain URI string identifying the vocabulary, OR an object reference ({"@id":
          "<uri>"}) to a vocabulary defined elsewhere in the document. Both forms
          are already in use across CDIF profiles and downstream ADA building blocks;
          permitting only the string form made the object form - the natural JSON-LD
          spelling of a reference - invalid, while this class''s own union-type policy
          above explicitly anticipates both.'
        anyOf:
        - type: string
        - type: object
          required:
          - '@id'
          additionalProperties: false
          properties:
            '@id':
              type: string
        x-jsonld-id: http://schema.org/inDefinedTermSet
      schema:termCode:
        type: string
        description: A representative code for this keyword in the controlled vocabulary.
          Analogous to skos:Notation
        x-jsonld-id: http://schema.org/termCode
    allOf:
    - required:
      - '@type'
    - anyOf:
      - required:
        - schema:name
      - required:
        - schema:identifier
      - required:
        - schema:termCode
    x-jsonld-prefixes:
      schema: http://schema.org/
    x-schema-source: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/schemaorgProperties/definedTerm/schema.yaml
    x-schema-version: https://json-schema.org/draft/2020-12/schema
  cdif.bbr.metadata.cdifDataType.objectReference:
    title: Object Reference
    description: A reference to a node defined elsewhere, by its @id.
    type: object
    properties:
      '@id':
        type: string
        description: resolvable @id of the referenced node
    required:
    - '@id'
    additionalProperties: false
    x-schema-source: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/cdifDataType/objectReference/schema.yaml
    x-schema-version: https://json-schema.org/draft/2020-12/schema
  cdif.bbr.metadata.cdifDataType.cdifStatistics:
    title: CDIF Statistics
    description: 'CDIF profile of the DDI-CDI Statistics / CategoryStatistics / StatisticsCollection
      classes (2026-03 model). A Statistics node carries one or more Statistic value
      objects; CategoryStatistics carries per-category results; a StatisticsCollection
      groups Statistics nodes. The root validates any of the three. CDIF divergences
      from canonical DDI-CDI: properties valued by InternationalString / LabelForDisplay
      / ObjectName are simplified to plain strings and carried under the cdif: namespace
      (cdif:name, cdif:descriptiveText, cdif:definition, cdif:displayLabel); the polymorphic
      cdi:has association is split into target-specific cdif:has_* keys; cdif:appliesTo
      and cdif:indexedBy are CDIF additions (not present in the canonical model) that
      link statistics to the InstanceVariable(s) they describe.'
    type: object
    anyOf:
    - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/xasProperties/xasOptional/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.cdifDataType.cdifStatistics/$defs/Statistics
    - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/xasProperties/xasOptional/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.cdifDataType.cdifStatistics/$defs/CategoryStatistics
    - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/xasProperties/xasOptional/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.cdifDataType.cdifStatistics/$defs/StatisticsCollection
    $defs:
      cdifConceptOrTermOrString:
        $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/xasProperties/xasOptional/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.cdifDataType.cdifConceptOrTermOrString
      cdifConceptOrTerm:
        $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/xasProperties/xasOptional/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.cdifDataType.cdifConceptOrTerm
      Statistic:
        title: Statistic
        description: "DDI-CDI Statistic dataType \u2014 a single computed value (mean,
          count, median, etc.). A value object with no identity; appears inline inside
          a cdi:statistic array."
        type: object
        properties:
          cdi:computationBase:
            type: string
            enum:
            - MissingOnly
            - Total
            - ValidOnly
            description: "The cases included in determining the statistic \u2014 Total
              (all cases, valid and missing), ValidOnly (valid values only), MissingOnly
              (invalid cases only)."
            x-jsonld-id: http://ddialliance.org/Specification/DDI-CDI/1.0/RDF/computationBase
          cdi:content:
            type: number
            description: The value of the statistic expressed as a real number.
            x-jsonld-id: http://ddialliance.org/Specification/DDI-CDI/1.0/RDF/content
          cdi:isWeighted:
            type: boolean
            default: false
            description: True if the statistic was computed using a weighting variable.
            x-jsonld-id: http://ddialliance.org/Specification/DDI-CDI/1.0/RDF/isWeighted
          cdi:typeOfNumericValue:
            type: string
            description: "The type of numeric value carried in cdi:content \u2014
              decimal, float, or double."
            x-jsonld-id: http://ddialliance.org/Specification/DDI-CDI/1.0/RDF/typeOfNumericValue
      Statistics:
        title: Statistics
        description: A named bundle of one or more Statistic value objects for an
          instance variable, optionally weighted, optionally broken down by Category.
        type: object
        properties:
          '@id':
            type: string
            description: Identifier for this Statistics node.
          '@type':
            type: array
            items:
              type: string
            contains:
              enum:
              - cdi:Statistics
            minItems: 1
          cdi:typeOfStatistic:
            description: "Controlled-vocabulary entry naming the kind of statistic
              \u2014 e.g. mean, median, count, sum, stdDev."
            x-jsonld-id: http://ddialliance.org/Specification/DDI-CDI/1.0/RDF/typeOfStatistic
            allOf:
            - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/xasProperties/xasOptional/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.cdifDataType.cdifStatistics/$defs/cdifConceptOrTermOrString
          cdi:statistic:
            type: array
            description: "Ordered list of Statistic value objects carried by this
              bundle. Order is significant \u2014 consumers MAY rely on array position."
            items:
              $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/xasProperties/xasOptional/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.cdifDataType.cdifStatistics/$defs/Statistic
            minItems: 1
            x-jsonld-id: http://ddialliance.org/Specification/DDI-CDI/1.0/RDF/statistic
          cdi:hasWeight:
            description: The InstanceVariable whose values were used as weights when
              computing the Statistic entries (inline cdifInstanceVariable node or
              an @id-reference).
            anyOf:
            - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/xasProperties/xasOptional/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.cdifDataType.cdifInstanceVariable
            - type: object
              additionalProperties: false
              properties:
                '@id':
                  type: string
              required:
              - '@id'
            x-jsonld-id: http://ddialliance.org/Specification/DDI-CDI/1.0/RDF/hasWeight
          cdif:appliesTo:
            type: array
            description: "CDIF addition (not in canonical DDI-CDI): the InstanceVariable(s)
              this Statistics bundle summarizes \u2014 the per-bundle \"what these
              numbers describe\" link. Used **only** when this Statistics bundle sits
              inside a StatisticsCollection that indexes more than one variable, to
              disambiguate which variable each bundle describes. It MUST NOT appear
              on a Statistics bundle attached at Dataset level via `cdif:statistics`;
              per-variable stats belong under `schema:variableMeasured[i].cdif:isDescribedBy_StatisticsCollection`
              (the direct JSON mapping of the DDI-CDI `InstanceVariable.isDescribedBy`
              association)."
            items:
              anyOf:
              - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/xasProperties/xasOptional/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.cdifDataType.cdifInstanceVariable
              - type: object
                additionalProperties: false
                properties:
                  '@id':
                    type: string
                required:
                - '@id'
            minItems: 1
            x-jsonld-id: https://w3id.org/cdif/appliesTo
          cdif:has_CategoryStatistics:
            type: array
            description: 'CategoryStatistics entries breaking this Statistics bundle
              down by Category. cdif: namespaced and target-suffixed because the DDI-CDI
              cdi:has association is polymorphic.'
            items:
              $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/xasProperties/xasOptional/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.cdifDataType.cdifStatistics/$defs/CategoryStatistics
            x-jsonld-id: https://w3id.org/cdif/has_CategoryStatistics
        required:
        - '@type'
        - cdi:statistic
      CategoryStatistics:
        title: CategoryStatistics
        description: Statistics for a specific Category of an instance variable within
          a data set.
        type: object
        properties:
          '@id':
            type: string
            description: Identifier for this CategoryStatistics node.
          '@type':
            type: array
            items:
              type: string
            contains:
              enum:
              - cdi:CategoryStatistics
            minItems: 1
          cdi:for:
            description: The Category this CategoryStatistics is for (inline Category
              node or an @id-reference).
            anyOf:
            - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/xasProperties/xasOptional/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.cdifDataType.cdifStatistics/$defs/Category
            - type: object
              additionalProperties: false
              properties:
                '@id':
                  type: string
              required:
              - '@id'
            x-jsonld-id: http://ddialliance.org/Specification/DDI-CDI/1.0/RDF/for
          cdi:typeOfStatistic:
            description: Controlled-vocabulary entry naming the kind of statistic.
            x-jsonld-id: http://ddialliance.org/Specification/DDI-CDI/1.0/RDF/typeOfStatistic
            allOf:
            - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/xasProperties/xasOptional/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.cdifDataType.cdifStatistics/$defs/cdifConceptOrTermOrString
          cdi:statistic:
            type: array
            description: Per-category Statistic value objects.
            items:
              $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/xasProperties/xasOptional/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.cdifDataType.cdifStatistics/$defs/Statistic
            minItems: 1
