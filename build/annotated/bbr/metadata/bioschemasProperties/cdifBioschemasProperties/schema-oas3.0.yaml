  cdif.bbr.metadata.schemaorgProperties.identifier:
    description: 'Properties for a schema.org identifier (schema:PropertyValue pattern).

      **Union-type policy:** In CDIF profile UML models an attribute typed as

      schema:Identifier / schema:PropertyValue is represented by a single attribute

      of that class type. The JSON Schema implementation permits the property value

      to be EITHER a plain string (interpreted as the bare identifier value) OR a

      full schema:PropertyValue object (with explicit @type, propertyID, value).

      Consumers should accept either form.

      '
    type: object
    properties:
      '@type':
        type: array
        items:
          type: string
        contains:
          enum:
          - schema:PropertyValue
        minItems: 1
      schema:propertyID:
        anyOf:
        - type: string
        - type: object
          additionalProperties: false
          required:
          - '@id'
          properties:
            '@id':
              type: string
        description: In this context for the schema:PropertyValue, this field is an
          identifier for the identifier schema, e.g. DOI, ARK.  Get values from https://registry.identifiers.org/registry/
          for interoperability. URI-shape values MUST be serialized as JSON-LD IRI
          references ({"@id":"..."}) so they participate in RDF entailment; free-label
          strings remain valid as strings.
        x-jsonld-id: http://schema.org/propertyID
      schema:value:
        type: string
        description: the identifier string. E.g. 10.5066/F7VX0DMQ
        x-jsonld-id: http://schema.org/value
      schema:url:
        type: string
        format: uri
        description: 'web-resolveable string for the identifier; host name part is
          location of a resolver that will return some representation for the given
          identifier value. E.g. https://doi.org/10.5066/F7VX0DMQ '
        x-jsonld-id: http://schema.org/url
    allOf:
    - required:
      - '@type'
    - anyOf:
      - required:
        - schema:value
      - required:
        - schema:url
    x-jsonld-prefixes:
      schema: http://schema.org/
    x-schema-source: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/schemaorgProperties/identifier/schema.yaml
    x-schema-version: https://json-schema.org/draft/2020-12/schema
title: CDIF Bioschemas Properties
description: Bioschemas classes and properties for laboratory workflow provenance
  in CDIF. Defines types and properties from the Bioschemas vocabulary and the ARC
  Workflow Run RO-Crate profile for describing lab processes, protocols, samples,
  parameters, equipment, and computational tools.
type: object
properties:
  bios:executesLabProtocol:
    description: The laboratory protocol executed by this process. Links a LabProcess
      activity to the LabProtocol it follows. In cdifProvActivity, also mapped to
      schema:actionProcess for compatibility.
    anyOf:
    - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/bioschemasProperties/cdifBioschemasProperties/schema-oas3.0.yaml#/$defs/LabProtocol
    - type: object
      additionalProperties: false
      properties:
        '@id':
          type: string
          description: reference to a LabProtocol defined elsewhere
      required:
      - '@id'
    x-jsonld-id: https://bioschemas.org/executesLabProtocol
  bios:parameterValue:
    description: Actual parameter values used during a lab process execution. Each
      entry is a schema:PropertyValue recording a specific instrument setting or measurement
      condition (temperature, flow rate, scan range, etc.).
    type: array
    items:
      $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/bioschemasProperties/cdifBioschemasProperties/schema-oas3.0.yaml#/$defs/ParameterValue
    x-jsonld-id: https://bioschemas.org/parameterValue
  bios:labEquipment:
    description: Laboratory equipment used in a protocol. Instruments, devices, and
      apparatus employed during the process.
    type: array
    items:
      anyOf:
      - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/bioschemasProperties/cdifBioschemasProperties/schema-oas3.0.yaml#/$defs/LabEquipment
      - type: object
        additionalProperties: false
        properties:
          '@id':
            type: string
            description: reference to equipment defined elsewhere
        required:
        - '@id'
    x-jsonld-id: https://bioschemas.org/labEquipment
  bios:computationalTool:
    description: Software or computational tool used as part of a lab protocol to
      complete a part of it.
    type: array
    items:
      anyOf:
      - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/bioschemasProperties/cdifBioschemasProperties/schema-oas3.0.yaml#/$defs/ComputationalTool
      - type: object
        additionalProperties: false
        properties:
          '@id':
            type: string
            description: reference to a software tool defined elsewhere
        required:
        - '@id'
    x-jsonld-id: https://bioschemas.org/computationalTool
  bios:reagent:
    description: Materials or chemical substances used in protocol execution.
    type: array
    items:
      anyOf:
      - type: string
        description: name or URI of the reagent
      - type: object
        properties:
          '@id':
            type: string
          schema:name:
            type: string
            x-jsonld-id: http://schema.org/name
          schema:description:
            type: string
            x-jsonld-id: http://schema.org/description
    x-jsonld-id: https://bioschemas.org/reagent
$defs:
  LabProcess:
    type: object
    description: "A Bioschemas LabProcess \u2014 a laboratory process execution. Used
      as an additionalType on a cdifProvActivity activity ([\"schema:Action\", \"prov:Activity\"])
      to indicate that the activity represents a lab process. Carries bios:executesLabProtocol
      to link to the protocol followed and bios:parameterValue for actual instrument
      settings."
    properties:
      '@type':
        type: array
        items:
          type: string
        description: Must include bios:LabProcess as additionalType on the activity
      '@id':
        type: string
      schema:name:
        type: string
        description: Short human-readable description of the execution
        x-jsonld-id: http://schema.org/name
      schema:description:
        type: string
        description: Details of the execution, e.g. command line arguments or notes
        x-jsonld-id: http://schema.org/description
      bios:executesLabProtocol:
        description: The executed protocol
        anyOf:
        - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/bioschemasProperties/cdifBioschemasProperties/schema-oas3.0.yaml#/$defs/LabProtocol
        - type: object
          additionalProperties: false
          properties:
            '@id':
              type: string
          required:
          - '@id'
        x-jsonld-id: https://bioschemas.org/executesLabProtocol
      bios:parameterValue:
        type: array
        items:
          $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/bioschemasProperties/cdifBioschemasProperties/schema-oas3.0.yaml#/$defs/ParameterValue
        x-jsonld-id: https://bioschemas.org/parameterValue
    required:
    - '@type'
    - schema:name
  LabProtocol:
    type: object
    description: A Bioschemas LabProtocol describing how a lab process should be carried
      out. Includes equipment, reagents, computational tools, and expected parameters.
      Maps to schema:HowTo in the cdifProvActivity context.
    properties:
      '@type':
        type: array
        items:
          type: string
        contains:
          enum:
          - bios:LabProtocol
        minItems: 1
      '@id':
        type: string
      schema:name:
        type: string
        description: Name of the protocol
        x-jsonld-id: http://schema.org/name
      schema:description:
        type: string
        description: Description of the protocol
        x-jsonld-id: http://schema.org/description
      schema:url:
        type: string
        format: uri
        description: URL to a published protocol document
        x-jsonld-id: http://schema.org/url
      bios:labEquipment:
        description: Equipment used in this protocol
        type: array
        items:
          anyOf:
