  cdif.bbr.metadata.niaidProperties.niaidDefinedTerm:
    title: NIAID defined term
    description: 'A schema:DefinedTerm with NIAID''s annotations. The NIAID Data Discovery
      Portal annotates every term it attaches to a dataset (species, infectious agents,
      health conditions, measurement techniques, variables): whether a curator checked
      it, the text it was matched from, who or what curated it, and for a taxon its
      common name. Across the portal''s records these properties appear on DefinedTerms
      and nowhere else, so this block is an extension of that type and requires it.'
    type: object
    allOf:
    - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/niaidProperties/niaidDataset/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.bioschemasProperties.bioschemasSample/$defs/term
    properties:
      '@type':
        type: array
        items:
          type: string
        contains:
          enum:
          - schema:DefinedTerm
        minItems: 1
      nde:isCurated:
        description: Whether a curator checked the term against its source text.
        type: boolean
        x-jsonld-id: https://discovery.biothings.io/ns/nde/isCurated
      nde:originalName:
        description: The text in the source record the term was matched from.
        type: string
        x-jsonld-id: https://discovery.biothings.io/ns/nde/originalName
      nde:curatedBy:
        description: Who or what produced or checked the annotation, often software
          (PubTator, GPT-4o-mini, the Biothings API).
        x-jsonld-id: https://discovery.biothings.io/ns/nde/curatedBy
        allOf:
        - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/niaidProperties/niaidDataset/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.niaidProperties.niaidDefinedTerm/$defs/curator
      cdifniaid:commonName:
        description: The common name of a taxon, e.g. Human for Homo sapiens.
        type: string
        x-jsonld-id: https://w3id.org/cdif/niaid/terms/commonName
    required:
    - '@type'
    $defs:
      curator:
        description: An agent, software application or catalog that curated something,
          and when. The portal types it as SoftwareApplication, Organization or DataCatalog,
          so the type is not constrained.
        type: object
        properties:
          schema:name:
            type: string
            x-jsonld-id: http://schema.org/name
          schema:url:
            type: string
            x-jsonld-id: http://schema.org/url
          schema:dateModified:
            type: string
            x-jsonld-id: http://schema.org/dateModified
          schema:archivedAt:
            type: string
            x-jsonld-id: http://schema.org/archivedAt
          nde:versionDate:
            type: string
            x-jsonld-id: https://discovery.biothings.io/ns/nde/versionDate
    x-jsonld-prefixes:
      schema: http://schema.org/
      nde: https://discovery.biothings.io/ns/nde/
      bios: https://bioschemas.org/
      cdifniaid: https://w3id.org/cdif/niaid/terms/
    x-bblocks-metadata:
      itemIdentifier: cdif.bbr.metadata.niaidProperties.niaidDefinedTerm
      register: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/register.json
      version: '1.0'
      dateOfLastChange: '2026-11-11'
    x-schema-source: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/niaidProperties/niaidDefinedTerm/schema.yaml
    x-schema-version: https://json-schema.org/draft/2020-12/schema
  cdif.bbr.metadata.niaidProperties.niaidDataCatalog:
    title: NIAID data catalog
    description: 'A repository a NIAID Data Discovery Portal dataset comes from: its
      name and address, the dataset''s page there (schema:archivedAt), and the version
      of the catalog the portal harvested (nde:versionDate).'
    type: object
    properties:
      '@type':
        type: array
        items:
          type: string
        contains:
          enum:
          - schema:DataCatalog
        minItems: 1
      schema:name:
        type: string
        x-jsonld-id: http://schema.org/name
      schema:url:
        type: string
        x-jsonld-id: http://schema.org/url
      schema:archivedAt:
        description: The dataset's page in this catalog.
        type: string
        x-jsonld-id: http://schema.org/archivedAt
      nde:versionDate:
        description: The date of the version of the catalog the portal harvested.
        type: string
        x-jsonld-id: https://discovery.biothings.io/ns/nde/versionDate
    required:
    - '@type'
    anyOf:
    - required:
      - schema:name
    - required:
      - schema:url
    x-jsonld-prefixes:
      schema: http://schema.org/
      nde: https://discovery.biothings.io/ns/nde/
      bios: https://bioschemas.org/
      cdifniaid: https://w3id.org/cdif/niaid/terms/
    x-bblocks-metadata:
      itemIdentifier: cdif.bbr.metadata.niaidProperties.niaidDataCatalog
      register: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/register.json
      version: '1.0'
      dateOfLastChange: '2026-11-11'
    x-schema-source: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/niaidProperties/niaidDataCatalog/schema.yaml
    x-schema-version: https://json-schema.org/draft/2020-12/schema
  cdif.bbr.metadata.niaidProperties.niaidCreativeWork:
    title: NIAID creative work
    description: A work that a NIAID Data Discovery Portal dataset cites or is cited
      by, with the portal's PubMed id, DOI and journal names. The portal types these
      as ScholarlyArticle or CreativeWork; JSON Schema cannot follow schema.org's
      subclass hierarchy, so both are listed.
    type: object
    properties:
      '@type':
        type: array
        items:
          type: string
        contains:
          enum:
          - schema:CreativeWork
          - schema:ScholarlyArticle
        minItems: 1
      schema:name:
        type: string
        x-jsonld-id: http://schema.org/name
      schema:url:
        type: string
        x-jsonld-id: http://schema.org/url
      nde:pmid:
        description: The PubMed id, digits only.
        x-jsonld-id: https://discovery.biothings.io/ns/nde/pmid
        allOf:
        - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/niaidProperties/niaidDataset/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.niaidProperties.niaidCreativeWork/$defs/pmid
      nde:doi:
        description: The DOI, as the portal gives it.
        x-jsonld-id: https://discovery.biothings.io/ns/nde/doi
        allOf:
        - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/niaidProperties/niaidDataset/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.bioschemasProperties.bioschemasSample/$defs/texts
      nde:journalName:
        type: string
        x-jsonld-id: https://discovery.biothings.io/ns/nde/journalName
      nde:journalNameAbbrev:
        type: string
        x-jsonld-id: https://discovery.biothings.io/ns/nde/journalNameAbbrev
    required:
    - '@type'
    $defs:
      pmid:
        type: string
        pattern: ^\d+$
    x-jsonld-prefixes:
      schema: http://schema.org/
      nde: https://discovery.biothings.io/ns/nde/
      bios: https://bioschemas.org/
      cdifniaid: https://w3id.org/cdif/niaid/terms/
    x-bblocks-metadata:
      itemIdentifier: cdif.bbr.metadata.niaidProperties.niaidCreativeWork
      register: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/register.json
