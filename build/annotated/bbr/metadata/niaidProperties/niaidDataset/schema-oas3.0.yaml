  cdif.bbr.metadata.bioschemasProperties.bioschemasSample:
    title: Bioschemas Sample properties
    description: 'Properties of a biological sample from the Bioschemas Sample draft
      (https://bioschemas.org/), in the bios: namespace. A node using them is typed
      with bios:Sample beside its own type. Every property accepts one value or an
      array, because framing collapses a one-element array to its value. Ranges follow
      the Bioschemas draft where it gives one, and allow text where real records use
      text for a term.'
    type: object
    properties:
      '@type':
        anyOf:
        - type: string
        - type: array
          items:
            type: string
      bios:anatomicalStructure:
        description: The organ or tissue the sample was collected from.
        x-jsonld-id: https://bioschemas.org/anatomicalStructure
        allOf:
        - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/niaidProperties/niaidDataset/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.bioschemasProperties.bioschemasSample/$defs/termsOrText
      bios:anatomicalSystem:
