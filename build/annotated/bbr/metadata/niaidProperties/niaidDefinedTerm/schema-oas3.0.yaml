x-defs:
  cdif.bbr.metadata.bioschemasProperties.bioschemasSample:
    title: Bioschemas Sample properties
    description: 'Properties of a biological sample from the Bioschemas Sample draft
      (https://bioschemas.org/), in the bios: namespace. A node using them is typed
      with bios:Sample beside its own type. Every property accepts one value or an
      array, because framing collapses a one-element array to its value. Ranges follow
      the Bioschemas draft where it gives one, and allow text where real records use
      text for a term.'
    type: object
    properties:
      '@type':
        anyOf:
        - type: string
        - type: array
          items:
            type: string
      bios:anatomicalStructure:
        description: The organ or tissue the sample was collected from.
        x-jsonld-id: https://bioschemas.org/anatomicalStructure
        allOf:
        - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/niaidProperties/niaidDefinedTerm/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.bioschemasProperties.bioschemasSample/$defs/termsOrText
      bios:anatomicalSystem:
        description: The anatomical system the sample was collected from, e.g. circulatory,
          digestive, immune.
        x-jsonld-id: https://bioschemas.org/anatomicalSystem
        allOf:
        - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/niaidProperties/niaidDefinedTerm/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.bioschemasProperties.bioschemasSample/$defs/termsOrText
      bios:associatedPhenotype:
        description: Defining characteristics expressed by the biological source of
          the sample.
        x-jsonld-id: https://bioschemas.org/associatedPhenotype
        allOf:
        - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/niaidProperties/niaidDefinedTerm/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.bioschemasProperties.bioschemasSample/$defs/termsOrText
      bios:collectionMethod:
        description: Conditions and methods of acquisition of the sample.
        x-jsonld-id: https://bioschemas.org/collectionMethod
        allOf:
        - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/niaidProperties/niaidDefinedTerm/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.bioschemasProperties.bioschemasSample/$defs/termsOrText
      bios:collector:
        description: The Person or Organization who collected the sample.
        anyOf:
        - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/niaidProperties/niaidDefinedTerm/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.bioschemasProperties.bioschemasSample/$defs/agent
        - type: array
          items:
            $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/niaidProperties/niaidDefinedTerm/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.bioschemasProperties.bioschemasSample/$defs/agent
        x-jsonld-id: https://bioschemas.org/collector
      bios:dateCollected:
        description: The date the sample was collected.
        x-jsonld-id: https://bioschemas.org/dateCollected
        allOf:
        - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/niaidProperties/niaidDefinedTerm/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.bioschemasProperties.bioschemasSample/$defs/dates
      bios:dateProcessed:
        description: The date the sample was processed or used in a method.
        x-jsonld-id: https://bioschemas.org/dateProcessed
        allOf:
        - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/niaidProperties/niaidDefinedTerm/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.bioschemasProperties.bioschemasSample/$defs/dates
      bios:developmentalStage:
        description: The age or developmental stage of the source when the sample
          was created, as a term or a quantity.
        anyOf:
        - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/niaidProperties/niaidDefinedTerm/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.bioschemasProperties.bioschemasSample/$defs/termOrQuantity
        - type: array
          items:
            $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/niaidProperties/niaidDefinedTerm/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.bioschemasProperties.bioschemasSample/$defs/termOrQuantity
        x-jsonld-id: https://bioschemas.org/developmentalStage
      bios:environmentalSystem:
        description: The habitat or ecosystem where the sample was collected.
        x-jsonld-id: https://bioschemas.org/environmentalSystem
        allOf:
        - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/niaidProperties/niaidDefinedTerm/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.bioschemasProperties.bioschemasSample/$defs/termsOrText
      bios:experimentalPurpose:
        description: The planned or executed experimental procedures involving the
          sample.
        x-jsonld-id: https://bioschemas.org/experimentalPurpose
        allOf:
        - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/niaidProperties/niaidDefinedTerm/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.bioschemasProperties.bioschemasSample/$defs/termsOrText
      bios:isControl:
        description: Whether the sample is used as a normal control.
        type: boolean
        x-jsonld-id: https://bioschemas.org/isControl
      bios:locationOfOrigin:
        description: The location from which the sample was originally collected.
        x-jsonld-id: https://bioschemas.org/locationOfOrigin
        allOf:
        - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/niaidProperties/niaidDefinedTerm/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.bioschemasProperties.bioschemasSample/$defs/termsOrText
      bios:sampleAvailability:
        description: Whether the sample is available for reuse.
        anyOf:
        - type: boolean
        - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/niaidProperties/niaidDefinedTerm/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.bioschemasProperties.bioschemasSample/$defs/termsOrText
        x-jsonld-id: https://bioschemas.org/sampleAvailability
      bios:sampleProcess:
        description: The processing technique applied to the sample.
        x-jsonld-id: https://bioschemas.org/sampleProcess
        allOf:
        - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/niaidProperties/niaidDefinedTerm/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.bioschemasProperties.bioschemasSample/$defs/termsOrText
      bios:sampleQuantity:
        description: The size of the sample.
        x-jsonld-id: https://bioschemas.org/sampleQuantity
        allOf:
        - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/niaidProperties/niaidDefinedTerm/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.bioschemasProperties.bioschemasSample/$defs/quantities
      bios:sampleState:
        description: The condition, composition or state of the sample, e.g. dried,
          frozen.
        x-jsonld-id: https://bioschemas.org/sampleState
        allOf:
        - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/niaidProperties/niaidDefinedTerm/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.bioschemasProperties.bioschemasSample/$defs/termsOrText
      bios:sampleStorageTemperature:
        description: The temperature at which the sample is stored.
        x-jsonld-id: https://bioschemas.org/sampleStorageTemperature
        allOf:
        - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/niaidProperties/niaidDefinedTerm/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.bioschemasProperties.bioschemasSample/$defs/quantities
      bios:sampleType:
        description: The type of sample, intentionally broad (cells, rock, sand).
        x-jsonld-id: https://bioschemas.org/sampleType
        allOf:
        - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/niaidProperties/niaidDefinedTerm/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.bioschemasProperties.bioschemasSample/$defs/termsOrText
      bios:sex:
        description: The biological sex of the individual the sample was obtained
          from.
        x-jsonld-id: https://bioschemas.org/sex
        allOf:
        - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/niaidProperties/niaidDefinedTerm/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.bioschemasProperties.bioschemasSample/$defs/termsOrText
      bios:studyID:
        description: The identifier of the study the sample belongs to.
        x-jsonld-id: https://bioschemas.org/studyID
        allOf:
        - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/niaidProperties/niaidDefinedTerm/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.bioschemasProperties.bioschemasSample/$defs/texts
      bios:studyTitle:
        description: The title of the study the sample belongs to.
        x-jsonld-id: https://bioschemas.org/studyTitle
        allOf:
        - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/niaidProperties/niaidDefinedTerm/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.bioschemasProperties.bioschemasSample/$defs/texts
      bios:project:
        description: The project the sample belongs to.
        x-jsonld-id: https://bioschemas.org/project
        allOf:
        - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/niaidProperties/niaidDefinedTerm/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.bioschemasProperties.bioschemasSample/$defs/termsOrText
    $defs:
      texts:
        anyOf:
        - type: string
        - type: array
          items:
            type: string
      dates:
        anyOf:
        - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/niaidProperties/niaidDefinedTerm/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.bioschemasProperties.bioschemasSample/$defs/date
        - type: array
          items:
            $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/niaidProperties/niaidDefinedTerm/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.bioschemasProperties.bioschemasSample/$defs/date
      date:
        type: string
        pattern: ^\d{4}(-\d{2}(-\d{2})?)?([T ].*)?$
      term:
        description: A defined term, or a reference to one. It must name or identify
          the term.
        type: object
        properties:
          '@id':
            type: string
          '@type':
            anyOf:
            - type: string
            - type: array
              items:
                type: string
          schema:name:
            anyOf:
            - type: string
            - type: array
              items:
                type: string
            x-jsonld-id: http://schema.org/name
          schema:identifier:
            type: string
            x-jsonld-id: http://schema.org/identifier
          schema:url:
            type: string
            x-jsonld-id: http://schema.org/url
          schema:inDefinedTermSet:
            type: string
            x-jsonld-id: http://schema.org/inDefinedTermSet
          schema:termCode:
            type: string
            x-jsonld-id: http://schema.org/termCode
        anyOf:
        - required:
          - schema:name
        - required:
          - schema:identifier
        - required:
          - '@id'
      termOrText:
        anyOf:
        - type: string
        - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/niaidProperties/niaidDefinedTerm/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.bioschemasProperties.bioschemasSample/$defs/term
      termsOrText:
        anyOf:
        - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/niaidProperties/niaidDefinedTerm/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.bioschemasProperties.bioschemasSample/$defs/termOrText
        - type: array
          items:
            $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/niaidProperties/niaidDefinedTerm/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.bioschemasProperties.bioschemasSample/$defs/termOrText
      quantity:
        description: A schema:QuantitativeValue; a range uses minValue and maxValue.
        type: object
        properties:
          '@type':
            anyOf:
            - type: string
            - type: array
              items:
                type: string
          schema:value:
            x-jsonld-id: http://schema.org/value
            anyOf:
            - type: number
            - type: string
          schema:minValue:
            type: number
