          schema:unitCode:
            type: string
            x-jsonld-id: http://schema.org/unitCode
          schema:name:
            type: string
            x-jsonld-id: http://schema.org/name
      quantities:
        anyOf:
        - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/niaidProperties/niaidDefinedTerm/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.bioschemasProperties.bioschemasSample/$defs/quantity
        - type: array
          items:
            $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/niaidProperties/niaidDefinedTerm/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.bioschemasProperties.bioschemasSample/$defs/quantity
      termOrQuantity:
        anyOf:
        - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/niaidProperties/niaidDefinedTerm/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.bioschemasProperties.bioschemasSample/$defs/termOrText
        - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/niaidProperties/niaidDefinedTerm/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.bioschemasProperties.bioschemasSample/$defs/quantity
      agent:
        type: object
        properties:
          '@type':
            anyOf:
            - type: string
            - type: array
              items:
                type: string
          schema:name:
            type: string
            x-jsonld-id: http://schema.org/name
