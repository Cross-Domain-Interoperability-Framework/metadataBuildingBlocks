  cdif.bbr.metadata.cdifDataType.cdifInstanceVariable:
    title: CDIF Instance Variable
    type: object
    properties:
      '@type':
        type: array
        description: Must include both schema:PropertyValue and cdi:InstanceVariable.
          Additional types may be included.
        items:
          type: string
        contains:
          enum:
          - cdi:InstanceVariable
      cdif:physicalDataType:
        description: identifier or name for the data type concept.
        x-jsonld-id: https://w3id.org/cdif/physicalDataType
        allOf:
        - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/ddiProperties/ddicdiPhysicalMapping/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.cdifDataType.cdifInstanceVariable/$defs/cdifConceptOrTermOrString
      cdif:role:
        type: string
        enum:
        - UnitIdentifier
        - Measure
        - Attribute
        - Dimension
        - Descriptor
        - ReferenceVariable
        description: Specifies the role this variable plays in a data structure. UnitIdentifier
          names the unit a row describes; Measure holds observed/derived values; Attribute
          qualifies an observation; Dimension addresses a cell in a multi-dimensional
          cube; Descriptor names the variable that a Reference column records values
          for (long format); ReferenceVariable holds those recorded values.
        x-jsonld-id: https://w3id.org/cdif/role
      cdif:simpleUnitOfMeasure:
        description: The unit in which the data values are measured (kg, pound, euro),
          expressed as a simple string, in cases where no additional information is
          available (in the legacy system) or needed (as in the case of broad agreement
          within the community of use [i.e., ISO country codes, currencies, etc. in
          SDMX])
        type: string
        x-jsonld-id: https://w3id.org/cdif/simpleUnitOfMeasure
      cdif:uses:
        type: array
        items:
          anyOf:
          - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/ddiProperties/ddicdiPhysicalMapping/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.cdifDataType.cdifInstanceVariable/$defs/cdifConceptOrTermOrString
          - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/ddiProperties/ddicdiPhysicalMapping/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.cdifDataType.cdifRepresentedVariable
        description: 'Essentially the same as schema:propertyID. References the concept(s)
          that this variable measures or represents and, under the Data Structure
          profile, the RepresentedVariable it instantiates. The RepresentedVariable
          branch is not new behaviour: it is what the rest of CDIF already documents
          and enforces. description.md calls cdif:uses "concepts (or, under the Data
          Structure profile, the RepresentedVariable)"; agents.md describes the InstanceVariable
          as "a pointer (via cdif:uses) into a richer RepresentedVariable"; the six
          NoDuplicate*Shape rules in cdifDataStructure traverse cdif:uses to reach
          that RepresentedVariable; and RepresentedVariableMustBeInstantiatedShape
          requires the link to exist. Only this schema said Concepts-only, and it
          was the outlier -- documents conforming to those rules could not be expressed
          here. A bare {@id} always matched via cdifConceptOrTerm; the branch is needed
          for the embedded form, because framing inlines a node whose @id is defined
          in the same document. cdif:isDefinedBy_RepresentedVariable remains the way
          to say that this InstanceVariable DEFERS its represented-variable-level
          properties to that RepresentedVariable; it is reference-only and carries
          the exclusivity rule. The cost is that cdif:uses no longer has a single
          value type, so it is a partial exception to the CDIF convention of disambiguating
          polymorphic DDI-CDI role names by target, and no longer strictly type-compatible
          with canonical cdi:uses, which is valued by a Concept.'
        x-jsonld-id: https://w3id.org/cdif/uses
      cdif:isDefinedBy_RepresentedVariable:
        description: 'The RepresentedVariable this InstanceVariable instantiates.
          A reference only (@id, nothing else): the point of the link is that the
          represented-variable-level properties are defined once on the RepresentedVariable
          and NOT duplicated here, so an inline copy would defeat it. The equivalent
          link within a data structure is cdif:isDefinedBy_Variable on cdifDataStructureComponent
          -- a different name because it means something wider: it accepts an InstanceVariable
          as well (in DDI-CDI an InstanceVariable IS a RepresentedVariable), and accepts
          one inline, because a structure may define a variable that exists nowhere
          else. This property stays narrow: the RepresentedVariable an InstanceVariable
          instantiates, by reference.'
        x-jsonld-id: https://w3id.org/cdif/isDefinedBy_RepresentedVariable
        allOf:
        - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/ddiProperties/ddicdiPhysicalMapping/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.cdifDataType.objectReference
      cdi:function:
        type: array
        items:
          $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/ddiProperties/ddicdiPhysicalMapping/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.cdifDataType.cdifInstanceVariable/$defs/cdifConceptOrTermOrString
        description: Immutable characteristic of the variable such as geographic designator,
          weight, temporal designation, etc. (InstanceVariable.function).
        x-jsonld-id: http://ddialliance.org/Specification/DDI-CDI/1.0/RDF/function
      cdi:platformType:
        description: The application or technical system context in which the variable
          has been realized - typically a statistical processing package or processing
          environment (InstanceVariable.platformType).
        x-jsonld-id: http://ddialliance.org/Specification/DDI-CDI/1.0/RDF/platformType
        allOf:
        - $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/ddiProperties/ddicdiPhysicalMapping/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.cdifDataType.cdifInstanceVariable/$defs/cdifConceptOrTermOrString
      cdi:source:
        anyOf:
        - type: string
        - type: object
          required:
          - '@id'
          additionalProperties: false
          properties:
            '@id':
              type: string
        description: Reference capturing provenance information for this InstanceVariable
          (InstanceVariable.source).
        x-jsonld-id: http://ddialliance.org/Specification/DDI-CDI/1.0/RDF/source
      cdif:isDescribedBy_StatisticsCollection:
        description: "The StatisticsCollection holding summary / category statistics
          for this InstanceVariable (direct JSON mapping of the DDI-CDI `InstanceVariable.isDescribedBy
          \u2192 StatisticsCollection` association). cdif: namespaced and target-suffixed
          because the DDI-CDI isDescribedBy association is polymorphic. This is the
          canonical CDIF path for **per-variable** statistics; dataset-scope aggregates
