      cdifConceptOrTerm:
        $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/build/annotated/bbr/metadata/ddiProperties/ddicdiPhysicalMapping/schema-oas3.0.yaml#/x-defs/cdif.bbr.metadata.cdifDataType.cdifConceptOrTerm
      Statistic:
        title: Statistic
        description: "DDI-CDI Statistic dataType \u2014 a single computed value (mean,
          count, median, etc.). A value object with no identity; appears inline inside
          a cdi:statistic array."
