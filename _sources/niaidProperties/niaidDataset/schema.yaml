$schema: https://json-schema.org/draft/2020-12/schema
title: NIAID dataset properties
description: >-
  The properties NIAID Data Discovery Portal records add to a CDIF dataset
  (composed with cdifCore and cdifDiscovery by the cdifNIAID profile; this
  module does NOT re-embed them). nde: terms are NIAID's
  (https://discovery.biothings.io/ns/nde/), bios: terms Bioschemas' (from the
  bioschemasSample block), and cdifniaid: terms the ones the portal uses that
  neither vocabulary declares. The properties NIAID adds to a DefinedTerm, a
  MonetaryGrant, a cited work, a Place and a DataCatalog are defined by the
  niaidDefinedTerm, niaidMonetaryGrant, niaidCreativeWork, niaidPlace and
  niaidDataCatalog blocks, which require those types. Every property accepts one
  value or an array, because framing collapses a one-element array to its value.
type: object
required:
- schema:includedInDataCatalog
properties:
  '@context':
    type: object
    properties:
      nde:
        const: https://discovery.biothings.io/ns/nde/
      bios:
        const: https://bioschemas.org/
      cdifniaid:
        const: https://w3id.org/cdif/niaid/terms/
  schema:subjectOf:
    properties:
      dcterms:conformsTo:
        type: array
        items:
          description: uri for specifications that this metadata record conforms to
          $ref: ../../cdifDataType/objectReference/schema.yaml
        minItems: 1
        contains:
          type: object
          required:
          - '@id'
          additionalProperties: false
          properties:
            '@id':
              const: https://w3id.org/cdif/niaid/1.0
  schema:includedInDataCatalog:
    description: The repositories holding the dataset, which the portal aggregates from.
    anyOf:
    - $ref: '#/$defs/catalog'
    - type: array
      minItems: 1
      items:
        $ref: '#/$defs/catalog'
  nde:date:
    description: The portal's summary date for the record.
    $ref: ../../bioschemasProperties/bioschemasSample/schema.yaml#/$defs/date
  nde:species:
    description: Species the dataset was collected from or is about.
    $ref: '#/$defs/terms'
  nde:topicCategory:
    description: Topics of the dataset, from the EDAM topic ontology.
    $ref: '#/$defs/terms'
  schema:infectiousAgent:
    description: Infectious agents the dataset is about.
    $ref: '#/$defs/terms'
  schema:healthCondition:
    description: Health conditions the dataset is about.
    $ref: '#/$defs/terms'
  schema:measurementTechnique:
    description: NIAID's annotations on the measurement techniques CDIF discovery describes.
    $ref: '#/$defs/termsOrText'
  schema:variableMeasured:
    description: NIAID's annotations on the variables CDIF discovery describes.
    $ref: '#/$defs/termsOrText'
  nde:nctid:
    description: ClinicalTrials.gov identifier of the study.
    anyOf:
    - $ref: '#/$defs/nctid'
    - type: array
      items:
        $ref: '#/$defs/nctid'
  nde:citedBy:
    description: Works that cite the dataset.
    $ref: '#/$defs/works'
  schema:citation:
    description: NIAID's journal and PubMed details on CDIF's citations.
    $ref: '#/$defs/works'
  nde:curatedBy:
    description: Who curated the record, and from which version of their catalog.
    $ref: ../niaidDefinedTerm/schema.yaml#/$defs/curator
  nde:isBasisFor:
    description: Resources based on this dataset.
    $ref: '#/$defs/relatedResources'
  nde:isRelatedTo:
    description: Related resources, with the relationship named.
    $ref: '#/$defs/relatedResources'
  nde:sample:
    description: The samples used to generate the dataset, or a collection of them.
    anyOf:
    - $ref: '#/$defs/sample'
    - $ref: '#/$defs/sampleCollection'
    - type: array
      items:
        anyOf:
        - $ref: '#/$defs/sample'
        - $ref: '#/$defs/sampleCollection'
  schema:funding:
    description: NIAID's grant details on CDIF's funding.
    anyOf:
    - $ref: '#/$defs/grant'
    - type: array
      items:
        $ref: '#/$defs/grant'
  schema:spatialCoverage:
    description: NIAID's administrative type on CDIF's spatial coverage.
    anyOf:
    - $ref: '#/$defs/place'
    - type: array
      items:
        $ref: '#/$defs/place'
  schema:sourceOrganization:
    description: Projects and programs the dataset comes from.
    anyOf:
    - $ref: '#/$defs/sourceOrganization'
    - type: array
      items:
        $ref: '#/$defs/sourceOrganization'
  bios:alternateIdentifier:
    description: Identifiers beyond the one CDIF's schema:identifier holds.
    $ref: ../../bioschemasProperties/bioschemasSample/schema.yaml#/$defs/texts
  cdifniaid:temporalIntervals:
    description: The portal's temporal intervals where they hold more than dates, kept whole beside schema:temporalCoverage.
    anyOf:
    - $ref: '#/$defs/temporalInterval'
    - type: array
      items:
        $ref: '#/$defs/temporalInterval'
  cdifniaid:unlinkedHasPart:
    description: Parts of the dataset with no address, which cannot be CDIF manifest parts.
    anyOf:
    - $ref: '#/$defs/namedThing'
    - type: array
      items:
        $ref: '#/$defs/namedThing'
  cdifniaid:assayformat:
    description: The assay format, as the portal gives it.
    $ref: ../../bioschemasProperties/bioschemasSample/schema.yaml#/$defs/texts
  cdifniaid:publication:
    description: PubMed identifiers of publications about the dataset.
    anyOf:
    - $ref: '#/$defs/pmid'
    - type: array
      items:
        $ref: '#/$defs/pmid'
$defs:
  types:
    anyOf:
    - type: string
    - type: array
      items:
        type: string
  reference:
    $ref: ../../cdifDataType/objectReference/schema.yaml
  catalog:
    anyOf:
    - $ref: '#/$defs/reference'
    - $ref: ../niaidDataCatalog/schema.yaml
  terms:
    description: NIAID's annotated terms; each must be a schema:DefinedTerm.
    anyOf:
    - $ref: ../niaidDefinedTerm/schema.yaml
    - type: array
      items:
        $ref: ../niaidDefinedTerm/schema.yaml
  annotated:
    description: >-
      An object carrying one of NIAID's term annotations, which must then be a
      NIAID defined term. Other objects are left to CDIF's own rules.
    type: object
    if:
      anyOf:
      - required:
        - nde:isCurated
      - required:
        - nde:originalName
      - required:
        - nde:curatedBy
      - required:
        - cdifniaid:commonName
    then:
      $ref: ../niaidDefinedTerm/schema.yaml
  termsOrText:
    anyOf:
    - type: string
    - $ref: '#/$defs/annotated'
    - type: array
      items:
        anyOf:
        - type: string
        - $ref: '#/$defs/annotated'
  nctid:
    type: string
    pattern: ^NCT\d{8}$
  pmid:
    type: string
    pattern: ^\d+$
  work:
    description: >-
      A cited or citing work. One carrying NIAID's PubMed id, DOI or journal names
      must be a NIAID creative work; a string or any other object is left to
      CDIF's own rules.
    anyOf:
    - type: string
    - type: object
      if:
        anyOf:
        - required:
          - nde:pmid
        - required:
          - nde:doi
        - required:
          - nde:journalName
        - required:
          - nde:journalNameAbbrev
      then:
        $ref: ../niaidCreativeWork/schema.yaml
  works:
    anyOf:
    - $ref: '#/$defs/work'
    - type: array
      items:
        $ref: '#/$defs/work'
  relatedResource:
    type: object
    properties:
      schema:name:
        type: string
      nde:relationship:
        description: How the resource is related, e.g. "has part" or "is part of".
        type: string
      nde:doi:
        $ref: ../../bioschemasProperties/bioschemasSample/schema.yaml#/$defs/texts
  relatedResources:
    anyOf:
    - $ref: '#/$defs/relatedResource'
    - type: array
      items:
        $ref: '#/$defs/relatedResource'
  grant:
    anyOf:
    - $ref: '#/$defs/reference'
    - $ref: ../niaidMonetaryGrant/schema.yaml
  place:
    anyOf:
    - $ref: '#/$defs/reference'
    - $ref: ../niaidPlace/schema.yaml
  sourceOrganization:
    type: object
    properties:
      cdifniaid:correctionApproved:
        description: A correction to the portal's record of the project has been approved.
        type: boolean
  temporalInterval:
    type: object
    properties:
      '@type':
        $ref: '#/$defs/types'
      schema:startDate:
        type: string
      schema:endDate:
        type: string
      schema:duration:
        type: string
      schema:name:
        type: string
      nde:temporalType:
        type: string
  namedThing:
    type: object
    properties:
      '@type':
        $ref: '#/$defs/types'
      schema:name:
        type: string
    required:
    - schema:name
  sample:
    description: A sample; nde:Sample is NIAID's subclass of the Bioschemas sample.
    allOf:
    - $ref: ../../bioschemasProperties/bioschemasSample/schema.yaml
    - type: object
      properties:
        nde:cellType:
          $ref: ../../bioschemasProperties/bioschemasSample/schema.yaml#/$defs/termsOrText
        nde:species:
          $ref: '#/$defs/terms'
        schema:aggregateElement:
          $ref: '#/$defs/sample'
  sampleCollection:
    description: A collection of samples, which NIAID types as an ItemList.
    type: object
    properties:
      '@type':
        $ref: '#/$defs/types'
      schema:numberOfItems:
        $ref: ../../bioschemasProperties/bioschemasSample/schema.yaml#/$defs/quantity
      schema:aggregateElement:
        $ref: '#/$defs/sample'
      schema:itemListElement:
        anyOf:
        - $ref: '#/$defs/sample'
        - type: array
          items:
            $ref: '#/$defs/sample'
