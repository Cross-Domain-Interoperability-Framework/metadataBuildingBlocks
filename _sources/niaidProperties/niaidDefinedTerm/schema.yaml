$schema: https://json-schema.org/draft/2020-12/schema
title: NIAID defined term
description: >-
  A schema:DefinedTerm with NIAID's annotations. The NIAID Data Discovery Portal
  annotates every term it attaches to a dataset (species, infectious agents,
  health conditions, measurement techniques, variables): whether a curator
  checked it, the text it was matched from, who or what curated it, and for a
  taxon its common name. Across the portal's records these properties appear on
  DefinedTerms and nowhere else, so this block is an extension of that type and
  requires it.
type: object
allOf:
- $ref: ../../bioschemasProperties/bioschemasSample/schema.yaml#/$defs/term
properties:
  '@type':
    type: array
    items:
      type: string
    contains:
      const: schema:DefinedTerm
    minItems: 1
  nde:isCurated:
    description: Whether a curator checked the term against its source text.
    type: boolean
  nde:originalName:
    description: The text in the source record the term was matched from.
    type: string
  nde:curatedBy:
    description: >-
      Who or what produced or checked the annotation, often software (PubTator,
      GPT-4o-mini, the Biothings API).
    $ref: '#/$defs/curator'
  cdifniaid:commonName:
    description: The common name of a taxon, e.g. Human for Homo sapiens.
    type: string
required:
- '@type'
$defs:
  curator:
    description: >-
      An agent, software application or catalog that curated something, and
      when. The portal types it as SoftwareApplication, Organization or
      DataCatalog, so the type is not constrained.
    type: object
    properties:
      schema:name:
        type: string
      schema:url:
        type: string
      schema:dateModified:
        type: string
      schema:archivedAt:
        type: string
      nde:versionDate:
        type: string
