---
$schema: https://json-schema.org/draft/2020-12/schema
title: definitions for a quality annotation property
description: >-
  A dqv:QualityAnnotation (a subclass of oa:Annotation) attaches a narrative or
  categorical quality statement -- a standards-compliance note, a rating, or a
  quality certificate -- to a resource. Unlike a dqv:QualityMeasurement it does
  not report a measured value against a named metric; the assertion lives in the
  annotation body.
type: object
properties:
  '@type':
    type: array
    items:
      type: string
    contains:
      const: dqv:QualityAnnotation
    minItems: 1
  'oa:hasBody':
    description: >-
      the content of the quality annotation -- a free-text statement, a
      categorical outcome as a Defined Term (e.g. a certification level or a
      pass/fail rating), or a reference to a separate body resource
    anyOf:
    - type: string
    - $ref: '#/$defs/DefinedTerm'
    - description: "a resolvable reference to the annotation body"
      $ref: ../../cdifDataType/objectReference/schema.yaml
  'oa:motivatedBy':
    description: >-
      why the annotation was made; for quality annotations this is normally the
      instance dqv:qualityAssessment, but any motivation IRI or Defined Term is
      allowed
    anyOf:
    - type: string
    - description: "a resolvable reference to an oa:Motivation"
      $ref: ../../cdifDataType/objectReference/schema.yaml
    - $ref: '#/$defs/DefinedTerm'
  'oa:hasTarget':
    description: "the resource the annotation is about; if omitted, the annotation is about the resource that carries it (e.g. the Dataset)"
    $ref: ../../cdifDataType/objectReference/schema.yaml
  'schema:name':
    type: string
    description: optional short human-readable label for the annotation
required:
- 'oa:hasBody'
$defs:
  DefinedTerm:
    $ref: ../../schemaorgProperties/definedTerm/schema.yaml
