$schema: https://json-schema.org/draft/2020-12/schema
title: SKOS Concept
description: >-
  JSON Schema for a SKOS Concept in JSON-LD form. A unit of thought within
  a concept scheme. Supports labels (prefLabel, altLabel, hiddenLabel),
  notations, hierarchical relations (broader/narrower), associative relations
  (related), cross-scheme mapping properties, scheme membership, and
  documentary notes. Based on the W3C SKOS Reference
  (https://www.w3.org/TR/skos-reference/).
allOf:
- $ref: '#/$defs/Concept'
$defs:
  Concept:
    type: object
    properties:
      '@context':
        description: JSON-LD context declaring the skos namespace prefix. May be a
          single object or an array of strings and objects.
        anyOf:
        - type: object
          properties:
            skos:
              const: "http://www.w3.org/2004/02/skos/core#"
          required:
          - skos
        - type: array
          items:
            anyOf:
            - type: string
            - type: object
          contains:
            type: object
            properties:
              skos:
                const: "http://www.w3.org/2004/02/skos/core#"
            required:
            - skos
      '@id':
        type: string
        description: URI identifier for this concept.
      '@type':
        type: array
        items:
          type: string
        contains:
          const: skos:Concept
        minItems: 1
      'skos:prefLabel':
        description: Preferred lexical label for this concept. A single string,
          a single language-tagged value, or an array of language-tagged values.
          Each language should appear at most once.
        anyOf:
        - type: string
        - $ref: '#/$defs/LanguageTaggedValue'
        - type: array
          items:
            $ref: '#/$defs/LanguageTaggedValue'
      'skos:altLabel':
        description: Alternative lexical labels (acronyms, abbreviations, spelling
          variants).
        anyOf:
        - type: string
        - $ref: '#/$defs/LanguageTaggedValue'
        - type: array
          items:
            anyOf:
            - type: string
            - $ref: '#/$defs/LanguageTaggedValue'
      'skos:hiddenLabel':
        description: Labels accessible to free-text search but not displayed.
        anyOf:
        - type: string
        - $ref: '#/$defs/LanguageTaggedValue'
        - type: array
          items:
            anyOf:
            - type: string
            - $ref: '#/$defs/LanguageTaggedValue'
      'skos:notation':
        description: Classification code for this concept within a scheme (a single
          notation string, consistent with CdifCodelistConcept).
        type: string
      'skos:definition':
        description: Formal explanation of the meaning of this concept.
        anyOf:
        - type: string
        - $ref: '#/$defs/LanguageTaggedValue'
        - type: array
          items:
            anyOf:
            - type: string
            - $ref: '#/$defs/LanguageTaggedValue'
      'skos:scopeNote':
        description: Note clarifying meaning and/or intended use.
        anyOf:
        - type: string
        - $ref: '#/$defs/LanguageTaggedValue'
        - type: array
          items:
            anyOf:
            - type: string
            - $ref: '#/$defs/LanguageTaggedValue'
      'skos:note':
        description: General note about this concept.
        anyOf:
        - type: string
        - $ref: '#/$defs/LanguageTaggedValue'
        - type: array
          items:
            anyOf:
            - type: string
            - $ref: '#/$defs/LanguageTaggedValue'
      'skos:historyNote':
        description: Note about past state or use.
        anyOf:
        - type: string
        - $ref: '#/$defs/LanguageTaggedValue'
        - type: array
          items:
            anyOf:
            - type: string
            - $ref: '#/$defs/LanguageTaggedValue'
      'skos:changeNote':
        description: Note documenting a change.
        anyOf:
        - type: string
        - $ref: '#/$defs/LanguageTaggedValue'
        - type: array
          items:
            anyOf:
            - type: string
            - $ref: '#/$defs/LanguageTaggedValue'
      'skos:editorialNote':
        description: Note for editors and maintainers.
        anyOf:
        - type: string
        - $ref: '#/$defs/LanguageTaggedValue'
        - type: array
          items:
            anyOf:
            - type: string
            - $ref: '#/$defs/LanguageTaggedValue'
      'skos:example':
        description: Example of the use of this concept.
        anyOf:
        - type: string
        - $ref: '#/$defs/LanguageTaggedValue'
        - type: array
          items:
            anyOf:
            - type: string
            - $ref: '#/$defs/LanguageTaggedValue'
      'skos:inScheme':
        description: Concept scheme(s) this concept belongs to.
        anyOf:
        - $ref: ../../cdifDataType/objectReference/schema.yaml
        - type: array
          items:
            $ref: ../../cdifDataType/objectReference/schema.yaml
      'skos:topConceptOf':
        description: Concept scheme(s) for which this is a top concept.
        anyOf:
        - $ref: ../../cdifDataType/objectReference/schema.yaml
        - type: array
          items:
            $ref: ../../cdifDataType/objectReference/schema.yaml
      'skos:broader':
        description: Broader (parent) concepts in the hierarchy. Items are inline
          concept objects or @id references.
        type: array
        items:
          anyOf:
          - $ref: '#/$defs/ConceptRef'
          - $ref: '#/$defs/Concept'
      'skos:narrower':
        description: Narrower (child) concepts in the hierarchy. Items are inline
          concept objects or @id references.
        type: array
        items:
          anyOf:
          - $ref: '#/$defs/ConceptRef'
          - $ref: '#/$defs/Concept'
      'skos:related':
        description: Associative (non-hierarchical) relations. Items are inline
          concept objects or @id references. Shaped like skos:broader/skos:narrower
          for consistency within this block. SKOS integrity condition S27 makes
          skos:related disjoint with the transitive closure of skos:broader; that is
          a graph-level constraint no JSON Schema can express, and rules.shacl does
          not yet assert it (it asserts only the reflexive skos:broader case).
        type: array
        items:
          anyOf:
          - $ref: '#/$defs/ConceptRef'
          - $ref: '#/$defs/Concept'
      # Cross-scheme mapping properties. @id references only, never inline: the
      # target is by definition a concept in ANOTHER scheme, so inlining it here
      # would assert a definition this document does not own. Single-or-array like
      # skos:inScheme rather than array-only like skos:broader -- one exactMatch is
      # the common case, and a property that is array-typed in the schema but scalar
      # after JSON-LD framing is the ARRAY_PROPERTIES trap in FrameAndValidate.
      'skos:exactMatch':
        description: Concepts in other schemes with equivalent meaning, by @id.
        anyOf:
        - $ref: '#/$defs/ConceptRef'
        - type: array
          items:
            $ref: '#/$defs/ConceptRef'
      'skos:closeMatch':
        description: Concepts in other schemes with sufficiently similar meaning to
          be interchangeable in some applications, by @id.
        anyOf:
        - $ref: '#/$defs/ConceptRef'
        - type: array
          items:
            $ref: '#/$defs/ConceptRef'
      'skos:broadMatch':
        description: Broader concepts in other schemes, by @id.
        anyOf:
        - $ref: '#/$defs/ConceptRef'
        - type: array
          items:
            $ref: '#/$defs/ConceptRef'
      'skos:narrowMatch':
        description: Narrower concepts in other schemes, by @id.
        anyOf:
        - $ref: '#/$defs/ConceptRef'
        - type: array
          items:
            $ref: '#/$defs/ConceptRef'
      'skos:relatedMatch':
        description: Associatively related concepts in other schemes, by @id.
        anyOf:
        - $ref: '#/$defs/ConceptRef'
        - type: array
          items:
            $ref: '#/$defs/ConceptRef'
    required:
    - '@type'
    - 'skos:prefLabel'
    - 'skos:definition'
    - 'skos:inScheme'
  ConceptRef:
    description: "A reference to a SKOS Concept by URI."
    $ref: ../../cdifDataType/objectReference/schema.yaml
  LanguageTaggedValue:
    type: object
    description: An RDF literal value with a language tag, serialized as a
      JSON-LD value object.
    properties:
      '@value':
        type: string
        description: The text content.
      '@language':
        type: string
        description: BCP 47 language tag (e.g. en, fr, de).
    required:
    - '@value'
    - '@language'
