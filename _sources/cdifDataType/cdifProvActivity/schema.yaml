---
$schema: https://json-schema.org/draft/2020-12/schema
title: CDIF Provenance Activity
description: Extended provenance activity building block for CDIF -- the schema.org
  implementation. Extends the minimal prov:Activity (generatedBy) with schema.org Action
  properties for agents, instruments, inputs and outputs, methodology and plan, temporal
  bounds, action chaining, and more. What the activity used is recorded with
  schema:instrument (instruments, software, reagents) and schema:object (inputs), not
  with prov:used.
type: object
allOf:
- $ref: ../../provProperties/generatedBy/schema.yaml
- type: object
  properties:
    '@type':
      type: array
      items:
        type: string
      minItems: 2
      contains:
        const: schema:Action
      description: Must include both schema:Action and prov:Activity (prov:Activity
        required by base generatedBy schema)
    'prov:used':
      description: >-
        Not used by this profile. A prov:used a record carries is accepted when it
        passes the core shape in generatedBy (strings and @id references) and is
        checked by nothing more. Record instruments, software and reagents with
        schema:instrument, and inputs with schema:object.
    'schema:instrument':
      type: array
      minItems: 1
      description: >-
        Instruments, software and reagents the activity used. Each item is either an
        {@id} reference to a thing described elsewhere, or a description in place whose
        schema:additionalType carries exactly one of three Wikidata terms (as the Wikidata
        entity IRI https://www.wikidata.org/entity/Q..., or a wd: CURIE bound to it), which says
        what kind of thing it is and selects the shape it must have:
        https://www.wikidata.org/entity/Q3099911 (measuring instrument) -> Instrument;
        https://www.wikidata.org/entity/Q7397 (software) -> Software;
        https://www.wikidata.org/entity/Q2356542 (chemical reagent, used here for reagents
        and reference materials) -> Reagent. The kind is read from additionalType, not
        @type, because a reagent can be a schema:Product just as an instrument is.
        Always an array: one activity commonly uses several (a laser ablation cell plus
        the ICP-MS it feeds, the acquisition software, the standards).
      items:
        anyOf:
        - description: reference to an instrument, software or reagent described elsewhere
          $ref: ../objectReference/schema.yaml
        - $ref: '#/$defs/UsedResource'
    'schema:name':
      type: string
      description: Human-readable name for the activity
    'schema:description':
      type: string
      description: Text description of what this activity did
    'schema:identifier':
      description: Formal identifier for this activity
      anyOf:
      - $ref: '#/$defs/Identifier'
      - type: string
    'schema:agent':
      description: Primary responsible agent for this activity (maps to PROV wasAssociatedWith)
      anyOf:
      - $ref: '#/$defs/Person'
      - $ref: '#/$defs/Organization'
      - $ref: '#/$defs/AgentInRole'
      - description: "reference to an agent defined elsewhere"
        $ref: ../objectReference/schema.yaml
    'schema:participant':
      description: Other participants in this activity
      type: array
      items:
        anyOf:
        - $ref: '#/$defs/Person'
        - $ref: '#/$defs/Organization'
        - $ref: '#/$defs/AgentInRole'
        - description: "reference to a participant defined elsewhere"
          $ref: ../objectReference/schema.yaml
    'schema:object':
      description: Input entity (or entities) for this activity. Per schema.org, the
        range of schema:object is schema:Thing. Accepts four shapes (1) a string URI,
        (2) an @id reference object, (3) an inline schema:Thing object, or (4) an array
        whose items take any of those shapes (used when an activity has multiple inputs,
        e.g. samples analyzed). Supports action chaining where the value references the
        result of a prior activity.
      anyOf:
      - type: string
      - description: "reference to an input entity"
        $ref: ../objectReference/schema.yaml
      - type: object
        description: Inline schema:Thing object describing the input entity.
        properties:
          '@type':
            type: array
            items:
              type: string
            minItems: 1
        required:
        - '@type'
      - type: array
        description: Multiple input entities (e.g. samples analyzed). Each item may be
          a string URI, an @id reference, or an inline schema:Thing.
        items:
          anyOf:
          - type: string
          - type: object
    'schema:result':
      description: >-
        Output entity (or entities) produced by this activity. Per schema.org,
        the range is schema:Thing. Accepts: (1) a string URI reference (action
        chaining shorthand to be referenced as schema:object of a subsequent
        activity); (2) a single {"@id": "<uri>"} object reference; (3) an
        inline schema:Thing (object with @type); or (4) an array of any of
        these forms (e.g. multiple datasets produced by this activity).
        Profiles may restrict the array item shape further.
      anyOf:
      - type: string
      - description: "reference to an output entity"
        $ref: ../objectReference/schema.yaml
      - type: object
        description: Inline schema:Thing object describing the output entity.
        properties:
          '@type':
            type: array
            items:
              type: string
            minItems: 1
        required:
        - '@type'
      - type: array
        description: >-
          Multiple output entities. Each item may be a string URI, an @id
          reference, or an inline schema:Thing.
        items:
          anyOf:
          - type: string
          - type: object
    'schema:actionStatus':
      type: string
      description: Status of this activity
      enum:
      - schema:CompletedActionStatus
      - schema:ActiveActionStatus
      - schema:PotentialActionStatus
      - schema:FailedActionStatus
    'schema:startTime':
      type: string
      description: ISO8601 date-time when the activity started (maps to PROV startedAtTime)
    'schema:endTime':
      type: string
      description: ISO8601 date-time when the activity ended (maps to PROV endedAtTime)
    'schema:location':
      description: Where the activity occurred
      anyOf:
      - $ref: '#/$defs/SpatialExtent'
      - type: string
      - description: "reference to a place defined elsewhere"
        $ref: ../objectReference/schema.yaml
    'schema:actionProcess':
      description: >-
        The plan the activity followed, or the procedure as it was performed. The
        {@id} reference form is the link to the plan (a protocol, method or workflow
        definition described elsewhere; CDIF defines no inline plan object). An inline
        HowTo is the procedure as performed; when the activity also followed a plan,
        that HowTo links the plan with schema:isBasedOn. One path finds the plan in
        both cases: prov:wasGeneratedBy/schema:actionProcess/schema:isBasedOn?
      anyOf:
      - $ref: '#/$defs/HowTo'
      - type: string
      - description: "reference to a methodology defined elsewhere"
        $ref: ../objectReference/schema.yaml
    'schema:error':
      type: string
      description: Error description for failed activities
    'schema:additionalProperty':
      description: >-
        Domain-specific extension properties, typically the parameter values this run
        used. schema.org does not list Action among this property's domains, so
        validator.schema.org warns on it; that warning is known and accepted, because
        schema.org has no Action property for parameter values.
      type: array
      items:
        $ref: '#/$defs/AdditionalProperty'
  # At least one of these: what the activity used, what it acted on, or the plan / procedure it
  # followed. Kept after the properties block, where it cannot capture property definitions.
  anyOf:
  - required: ['schema:instrument']
  - required: ['schema:object']
  - required: ['schema:actionProcess']
$defs:
  Person:
    $ref: ../../schemaorgProperties/person/schema.yaml
  Organization:
    $ref: ../../schemaorgProperties/organization/schema.yaml
  AgentInRole:
    $ref: ../../schemaorgProperties/agentInRole/schema.yaml
  Identifier:
    $ref: ../../schemaorgProperties/identifier/schema.yaml
  Instrument:
    $ref: ../../schemaorgProperties/instrument/schema.yaml
  SpatialExtent:
    $ref: ../../schemaorgProperties/spatialExtent/schema.yaml
  AdditionalProperty:
    $ref: ../../schemaorgProperties/additionalProperty/schema.yaml
  UsedResource:
    type: object
    description: >-
      An instrument, software or reagent described in place. schema:additionalType
      must carry exactly one of the three kind terms; the kind then pins the shape.
      A domain profile adds its own properties (a role, a version, settings).
    required:
    - '@type'
    - 'schema:additionalType'
    properties:
      '@type':
        type: array
        items:
          type: string
        minItems: 1
      'schema:additionalType':
        type: array
        minItems: 1
    oneOf:
    - $ref: '#/$defs/KindInstrument'
    - $ref: '#/$defs/KindSoftware'
    - $ref: '#/$defs/KindReagent'
    allOf:
    - if:
        $ref: '#/$defs/KindInstrument'
      then:
        $ref: '#/$defs/Instrument'
    - if:
        $ref: '#/$defs/KindSoftware'
      then:
        $ref: '#/$defs/Software'
    - if:
        $ref: '#/$defs/KindReagent'
      then:
        $ref: '#/$defs/Reagent'
  KindInstrument:
    description: schema:additionalType names the Wikidata measuring-instrument term
    properties:
      'schema:additionalType':
        contains:
          type: object
          required: ['@id']
          properties:
            '@id':
              enum:
              - https://www.wikidata.org/entity/Q3099911
              - wd:Q3099911
    required: ['schema:additionalType']
  KindSoftware:
    description: schema:additionalType names the Wikidata software term
    properties:
      'schema:additionalType':
        contains:
          type: object
          required: ['@id']
          properties:
            '@id':
              enum:
              - https://www.wikidata.org/entity/Q7397
              - wd:Q7397
    required: ['schema:additionalType']
  KindReagent:
    description: schema:additionalType names the Wikidata chemical-reagent term
    properties:
      'schema:additionalType':
        contains:
          type: object
          required: ['@id']
          properties:
            '@id':
              enum:
              - https://www.wikidata.org/entity/Q2356542
              - wd:Q2356542
    required: ['schema:additionalType']
  Software:
    type: object
    description: Software used by the activity (acquisition, reduction, processing).
    properties:
      '@type':
        type: array
        items:
          type: string
        contains:
          const: schema:SoftwareApplication
      '@id':
        type: string
      'schema:name':
        type: string
      'schema:softwareVersion':
        type: string
      'schema:url':
        type: string
        format: uri
    required:
    - '@type'
    - schema:name
  Reagent:
    type: object
    description: >-
      A reagent, standard or reference material used by the activity. @type says what
      the material is: schema:DefinedTerm for a material identified by a registry entry
      (e.g. a GeoReM reference material), schema:Product for a catalogued specimen or
      purchased lot, schema:ChemicalSubstance for a bulk chemical.
    properties:
      '@type':
        type: array
        items:
          type: string
        contains:
          enum:
          - schema:DefinedTerm
          - schema:Product
          - schema:ChemicalSubstance
      '@id':
        type: string
      'schema:name':
        type: string
    required:
    - '@type'
    - schema:name
  HowTo:
    type: object
    description: A methodology or protocol described as a HowTo with optional steps
    properties:
      '@type':
        type: array
        items:
          type: string
        contains:
          const: schema:HowTo
        minItems: 1
      '@id':
        type: string
      'schema:name':
        type: string
        description: Name of the methodology or protocol
      'schema:description':
        type: string
        description: Description of the methodology
      'schema:url':
        type: string
        format: uri
        description: URL to a published methodology or protocol document
      'schema:isBasedOn':
        description: >-
          The plan this procedure was based on, when the activity both followed a plan
          and records the procedure as performed. A reference only, for now.
        $ref: ../objectReference/schema.yaml
      'schema:step':
        type: array
        description: Ordered steps in this methodology
        items:
          $ref: '#/$defs/HowToStep'
    required:
    - '@type'
    anyOf:
    - required:
      - schema:name
    - required:
      - schema:url
  HowToStep:
    type: object
    description: A single step in a HowTo methodology
    properties:
      '@type':
        type: array
        items:
          type: string
        contains:
          const: schema:HowToStep
        minItems: 1
      'schema:name':
        type: string
        description: Name of this step
      'schema:description':
        type: string
        description: Description of what this step involves
      'schema:url':
        type: string
        format: uri
        description: URL to documentation for this step
      'schema:position':
        type: integer
        description: Ordinal position of this step
    required:
    - '@type'
    - schema:name
