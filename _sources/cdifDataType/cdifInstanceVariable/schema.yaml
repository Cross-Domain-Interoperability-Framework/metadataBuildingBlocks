---
$schema: https://json-schema.org/draft/2020-12/schema
title: CDIF Instance Variable
type: object
properties:
  '@type':
    type: array
    description: Must include both schema:PropertyValue and cdi:InstanceVariable.
      Additional types may be included.
    items:
      type: string
    contains:
      const: cdi:InstanceVariable
  'cdif:physicalDataType':
    $ref: '#/$defs/cdifConceptOrTermOrString'
    description: identifier or name for the data type concept.
  'cdif:role':
    type: string
    enum:
      - UnitIdentifier
      - Measure
      - Attribute
      - Dimension
      - Descriptor
      - ReferenceVariable
    description: Specifies the role this variable plays in a data structure. UnitIdentifier names the unit a row describes; Measure holds observed/derived values; Attribute qualifies an observation; Dimension addresses a cell in a multi-dimensional cube; Descriptor names the variable that a Reference column records values for (long format); ReferenceVariable holds those recorded values.
  'cdif:simpleUnitOfMeasure':
    description: The unit in which the data values are measured (kg, pound, euro), expressed as a simple
      string, in cases where no additional information is available (in the legacy system)
      or needed (as in the case of broad agreement within the community of use [i.e., ISO
      country codes, currencies, etc. in SDMX])
    type: string
  'cdif:uses':
    type: array
    items:
      $ref: '#/$defs/cdifConceptOrTermOrString'
    description: >-
      Essentially the same as schema:propertyID. References to the concept(s) that this
      variable measures or represents. Concepts only -- to point at the RepresentedVariable
      that supplies the represented-variable-level properties, use
      cdif:isDefinedBy_RepresentedVariable. Splitting the two targets follows the CDIF
      convention of disambiguating the polymorphic DDI-CDI role names by target, so each
      JSON key has a single value type; it also keeps cdif:uses type-compatible with
      canonical cdi:uses on InstanceVariable, which is valued by a Concept.
  'cdif:isDefinedBy_RepresentedVariable':
    $ref: '../objectReference/schema.yaml'
    description: >-
      The RepresentedVariable this InstanceVariable instantiates. A reference only
      (@id, nothing else): the point of the link is that the represented-variable-level
      properties are defined once on the RepresentedVariable and NOT duplicated here, so
      an inline copy would defeat it. Same property name as on cdifDataStructureComponent,
      which carries the equivalent link within a data structure; that one also accepts an
      inline RepresentedVariable because a structure may define one that exists nowhere
      else.
  'cdi:function':
    type: array
    items:
      $ref: '#/$defs/cdifConceptOrTermOrString'
    description: >-
      Immutable characteristic of the variable such as geographic designator, weight,
      temporal designation, etc. (InstanceVariable.function).
  'cdi:platformType':
    $ref: '#/$defs/cdifConceptOrTermOrString'
    description: >-
      The application or technical system context in which the variable has been realized -
      typically a statistical processing package or processing environment
      (InstanceVariable.platformType).
  'cdi:source':
    anyOf:
    - type: string
    - type: object
      required: ['@id']
      additionalProperties: false
      properties:
        '@id':
          type: string
    description: >-
      Reference capturing provenance information for this InstanceVariable
      (InstanceVariable.source).
  'cdif:isDescribedBy_StatisticsCollection':
    description: >-
      The StatisticsCollection holding summary / category statistics for this
      InstanceVariable (direct JSON mapping of the DDI-CDI
      `InstanceVariable.isDescribedBy → StatisticsCollection` association).
      cdif: namespaced and target-suffixed because the DDI-CDI isDescribedBy
      association is polymorphic. This is the canonical CDIF path for
      **per-variable** statistics; dataset-scope aggregates (row count etc.)
      go under `Dataset.cdif:statistics` instead.
    anyOf:
    - $ref: '../../cdifDataType/cdifStatistics/schema.yaml#/$defs/StatisticsCollection'
    - type: object
      additionalProperties: false
      properties:
        '@id':
          type: string
      required: ['@id']
  'cdi:describedUnitOfMeasure':
    $ref: '#/$defs/cdifConceptOrTerm'
    description: >-
      The unit in which the data values are measured, expressed as a controlled-vocabulary
      entry (RepresentedVariable.describedUnitOfMeasure). For a plain-string unit, use
      cdif:simpleUnitOfMeasure instead.
  'cdi:qualifies':
    type: object
    required: ['@id']
    additionalProperties: false
    properties:
       '@id':
        type: string
    description: reference to an instance variable defined for this dataset
allOf:
- required:
  - '@type'
- $ref: ../../schemaorgProperties/variableMeasured/schema.yaml
$defs:
  cdifConceptOrTermOrString:
    $ref: ../cdifConceptOrTermOrString/schema.yaml
  cdifConceptOrTerm:
    $ref: ../cdifConceptOrTerm/schema.yaml
