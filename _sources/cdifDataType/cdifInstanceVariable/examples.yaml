- title: Minimal CDIF Instance Variable
  content: |-
    Single schema:PropertyValue + cdi:InstanceVariable node carrying
    @type, @id, schema:name, cdif:name, cdif:definition and
    cdi:takesSubstantiveValuesFrom.

    Nothing here is required by the model. Canonical ddicdiInstanceVariable
    requires only @type -- all six of its attributes and all three of its
    associations have a lower bound of 0 in the DDI-CDI XMI -- and this block
    adds no required list of its own. "Minimal" therefore means the smallest
    set that describes a variable usefully, not the smallest set that
    validates; an InstanceVariable carrying @type alone is legal.

    Earlier text here claimed the block "inherits ddicdiInstanceVariable's
    required list: @type, cdi:name, cdi:definition,
    cdi:takesSubstantiveValuesFrom" and attributed it to a
    CdifInstanceVariableNode shape. Four things were wrong: there is no such
    required list to inherit, no shape of that name exists in any rules.shacl,
    and the prefixes were stale -- the example carries cdif:name and
    cdif:definition, not cdi:. It also omitted schema:name, which the example
    does carry. The one shape that does target cdi:InstanceVariable here is
    cdifd:CDIFxasInstanceVariableShape, and it constrains the FORM of
    cdif:physicalDataType rather than requiring any property.
  prefixes:
    schema: http://schema.org/
    cdi: http://ddialliance.org/Specification/DDI-CDI/1.0/RDF/
  snippets:
    - language: json
      ref: exampleCdifInstanceVariableMinimal.json
- title: Complete CDIF Instance Variable (XAS)
  content: |-
    Implementation of Schema.org PropertyValue as value for variableMeasured
    property, adding cdi:InstanceVariable type and several other DDI-CDI
    properties. From the X-Ray Absorption profile testing corpus, with two
    InstanceVariables in an @graph and a parent schema:Dataset that references
    them via schema:variableMeasured.
  prefixes:
    schema: http://schema.org/
    cdi: http://ddialliance.org/Specification/DDI-CDI/1.0/RDF/
    xas: https://w3id.org/cdif/xas/
    skos: http://www.w3.org/2004/02/skos/core#
  snippets:
    - language: json
      ref: exampleCdifInstanceVariableComplete.json
- title: CDIF Instance Variable with category statistics (DDI Codebook)
  content: |-
    A categorical InstanceVariable exercising cdif:isDescribedBy_StatisticsCollection.
    Derived from variable HH14 ("Language of the Questionnaire") of the MWI 2019 MICS
    household record (DDI Codebook 2.5). Shows how DDI <catgry>/<catStat>/<sumStat>
    map to CDIF: the categories become an enumerated value domain
    (cdi:takesSubstantiveValuesFrom -> SubstantiveValueDomain -> EnumerationDomain ->
    a skos:ConceptScheme code list), the "Sysmiss" missing category becomes a
    SentinelValueDomain, and the summary + per-category frequencies become a
    StatisticsCollection of cdi:Statistics (count/min/max, split by
    cdi:computationBase) and cdi:CategoryStatistics (one per category, cdi:for
    referencing the code-list concept).
  prefixes:
    schema: http://schema.org/
    cdi: http://ddialliance.org/Specification/DDI-CDI/1.0/RDF/
    cdif: https://w3id.org/cdif/
    skos: http://www.w3.org/2004/02/skos/core#
    mics: https://example.org/mics/mwi2019/
  snippets:
    - language: json
      ref: exampleCdifInstanceVariableStatistics.json
- title: CDIF Instance Variable with category statistics (minimal, no missing)
  content: |-
    The pared-down companion to the HH14 statistics example. Variable HH6
    ("Area", urban/rural) of the MWI 2019 MICS household record (DDI Codebook
    2.5): a binary category with no missing values, so there is a substantive
    value domain (2-concept code list) but no SentinelValueDomain. The
    StatisticsCollection carries count/min/max plus one cdi:CategoryStatistics
    per category; the category frequencies (3936 + 22946) reconcile with the
    valid count (26882).
  prefixes:
    schema: http://schema.org/
    cdi: http://ddialliance.org/Specification/DDI-CDI/1.0/RDF/
    cdif: https://w3id.org/cdif/
    skos: http://www.w3.org/2004/02/skos/core#
    mics: https://example.org/mics/mwi2019/
  snippets:
    - language: json
      ref: exampleCdifInstanceVariableStatisticsMinimal.json
