$schema: https://json-schema.org/draft/2020-12/schema
type: object
title: CDIF NIAID profile
description: >-
  CDIF profile for dataset records from the NIAID Data Discovery Portal.
  Composes cdifCore with niaidDataset, which constrains the NIAID (nde:),
  Bioschemas (bios:) and cdifniaid: properties those records carry.
  cdifDiscovery is not composed: about one record in six from the portal has
  no discovery content, so a record that has it claims and is validated against
  cdifDiscovery as well, as its own conformsTo entry.
allOf:
- $ref: ../../../profiles/cdifProfile/cdifCore/schema.yaml
- $ref: ../../../niaidProperties/niaidDataset/schema.yaml
