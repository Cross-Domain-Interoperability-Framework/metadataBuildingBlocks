- title: CDIF data description example record.
  content: |-
    Example CDIF metadata with data description extensions for distributions
    (single-file, archive with hasPart, and WebAPI) and optional tabular/dataCube
    physical mappings.
  prefixes:
    schema: http://schema.org/
    cdi: http://ddialliance.org/Specification/DDI-CDI/1.0/RDF/
    dcterms: http://purl.org/dc/terms/
    spdx: http://spdx.org/rdf/terms#
  snippets:
    - language: json
      ref: exampleCDIFDataDescription.json

- title: Dimensional (data cube) example.
  content: |-
    Gridded sea-water temperature in a single NetCDF file. The distribution is
    typed as cdi:StructuredDataSet and the four dimension variables (time, depth,
    latitude, longitude) plus the temperature measure are declared as
    InstanceVariables with cdif:role of Dimension or Measure. Physical mappings
    use cdi:locator to point at the NetCDF variable paths.
  prefixes:
    schema: http://schema.org/
    cdi: http://ddialliance.org/Specification/DDI-CDI/1.0/RDF/
    dcterms: http://purl.org/dc/terms/
    spdx: http://spdx.org/rdf/terms#
  snippets:
    - language: json
      ref: exampleCDIFDataDescription_dimensional.json

- title: Wide (one row per unit) example.
  content: |-
    Monthly water-quality observations in wide form: one row per (station,
    sample_date) and one column per measured parameter. Distribution is typed as
    cdi:TabularTextDataSet. InstanceVariable roles are UnitIdentifier (station),
    Attribute (date), and Measure (pH, temperature, salinity, dissolved oxygen).
    cdif:hasPrimaryKey wires the (station, sample_date) composite key.
  prefixes:
    schema: http://schema.org/
    cdi: http://ddialliance.org/Specification/DDI-CDI/1.0/RDF/
    dcterms: http://purl.org/dc/terms/
    spdx: http://spdx.org/rdf/terms#
  snippets:
    - language: json
      ref: exampleCDIFDataDescription_wide.json

- title: Long (descriptor/value) example.
  content: |-
    The same water-quality observations cast in long form: each row is one
    observation with a parameter-name column (cdif:role Descriptor) and a value
    column (cdif:role ReferenceVariable). The four named parameters remain in
    schema:variableMeasured as Measure InstanceVariables; wiring descriptor codes
    to them is a Data Structure profile concern, not a data description one.
  prefixes:
    schema: http://schema.org/
    cdi: http://ddialliance.org/Specification/DDI-CDI/1.0/RDF/
    dcterms: http://purl.org/dc/terms/
    spdx: http://spdx.org/rdf/terms#
  snippets:
    - language: json
      ref: exampleCDIFDataDescription_long.json

- title: Minimal conforming record.
  content: |-
    The least a record can carry and still conform: name, identifier,
    dateModified, license, url, one InstanceVariable, and a catalog record
    declaring core, discovery and data_description. Useful as the floor when
    checking whether a constraint is really required.
  prefixes:
    schema: http://schema.org/
    cdi: http://ddialliance.org/Specification/DDI-CDI/1.0/RDF/
    dcterms: http://purl.org/dc/terms/
    spdx: http://spdx.org/rdf/terms#
  snippets:
    - language: json
      ref: exampleCDIFDataDescriptionMinimal.json

- title: Complete record, every optional slice populated.
  content: |-
    Daily air temperature for Flagstaff, Arizona. Exercises the optional half of
    the profile that the other examples leave out: agents (creator, contributor,
    publisher, provider, funding), spatial and temporal coverage, quality
    measurements, provenance (prov:wasGeneratedBy, prov:wasDerivedFrom),
    cdif:hasPrimaryKey and cdif:statistics, and two distributions -- a delimited
    cdi:TabularTextDataSet with checksum and a cdi:StructuredDataSet -- each with
    its own cdif:hasPhysicalMapping.
  prefixes:
    schema: http://schema.org/
    cdi: http://ddialliance.org/Specification/DDI-CDI/1.0/RDF/
    dcterms: http://purl.org/dc/terms/
    spdx: http://spdx.org/rdf/terms#
  snippets:
    - language: json
      ref: exampleCDIFDataDescriptionComplete.json
