---
$schema: https://json-schema.org/draft/2020-12/schema
title: definitions for roles used in XAS profile
type: object
properties:
  '@type':
    type: array
    items:
      type: string
    minItems: 2
    uniqueItems: true
    allOf:
    - contains:
        const: 'schema:Product'
      minContains: 1
    - contains:
        const: 'schema:Thing'
      minContains: 1
  'schema:additionalType':
    type: array
    items:
      anyOf:
      - type: string
      - type: object
        required:
        - '@id'
        properties:
          '@id':
            type: string
    minItems: 2
    uniqueItems: true
    allOf:
    - contains:
        const: MaterialSample
      minContains: 1
    - contains:
        type: object
        required:
        - '@id'
        properties:
          '@id':
            const: 'https://w3id.org/isample/vocabulary/materialsampleobjecttype/materialsample'
      minContains: 1
  'schema:name':
    type: string
  'schema:identifier':
    anyOf:
    - type: string
    - $ref: '#/$defs/Identifier'
  'schema:description':
    type: string
  'schema:additionalProperty':
    type: array
    description: >-
      Sample additionalProperty entries (base AdditionalProperty shape).
      The XDI Sample.* propertyID vocabulary enum is layered on in
      xasOptional, so it applies at the profile level, not this shape.
    items:
      $ref: '#/$defs/AdditionalProperty'
required:
- '@type'
- 'schema:additionalType'
- 'schema:name'
$defs:
  Identifier:
    $ref: ../../schemaorgProperties/identifier/schema.yaml
  AdditionalProperty:
    $ref: ../../schemaorgProperties/additionalProperty/schema.yaml