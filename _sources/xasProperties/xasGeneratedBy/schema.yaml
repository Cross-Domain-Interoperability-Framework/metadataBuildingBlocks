---
$schema: https://json-schema.org/draft/2020-12/schema
title: XAS Analysis Event activity
description: XAS-specific provenance activity building block. Extends cdifProvActivity with
  XAS analysis event typing (xas:analysisevent), XAS facility location,
  sample object, XAS-specific instrument type, and XAS additional properties
  (edge_energy, calibration method, instrument configuration, installedOptions).
allOf:
- $ref: ../../cdifDataType/cdifProvActivity/schema.yaml
- type: object
  required:
  - 'schema:additionalType'
  properties:
    '@type':
      type: array
      items:
        type: string
    'schema:additionalType':
      description: Domain type(s) for the activity; must include xas:analysisevent (an XAS analysis event).
      type: array
      items:
        anyOf:
        - type: string
        - type: object
          additionalProperties: false
          required:
          - '@id'
          properties:
            '@id':
              type: string
      contains:
        type: object
        additionalProperties: false
        required:
        - '@id'
        properties:
          '@id':
            const: xas:analysisevent
    # startTime/endTime, not startDate: schema.org gives startDate to
    # Event and CreativeWork, and this subject is a schema:Action. The
    # core cdifProvActivity shape asks for these two by name.
    'schema:startTime':
      type: string
      description: Date/time the XAS analysis started
    'schema:endTime':
      type: string
      description: Date/time the XAS analysis finished
    'prov:used':
      type: array
      items:
        anyOf:
        - type: object
          required:
          - 'schema:instrument'
          properties:
            'schema:instrument':
              $ref: '#/$defs/Instrument'
        - type: string
        - type: object
          required: ['@id']
          additionalProperties: false
          properties:
            '@id':
              type: string
      allOf:
      - description: >-
          Must contain a prov:used entry whose schema:instrument is classified
          as an xas:beamline (via schema:additionalType) and carries a
          schema:name (the beamline name).
        contains:
          type: object
          properties:
            'schema:instrument':
              type: object
              properties:
                'schema:additionalType':
                  anyOf:
                  - type: object
                    additionalProperties: false
                    required:
                    - '@id'
                    properties:
                      '@id':
                        const: 'xas:beamline'
                  - type: array
                    contains:
                      type: object
                      additionalProperties: false
                      required:
                      - '@id'
                      properties:
                        '@id':
                          const: 'xas:beamline'
                'schema:name':
                  type: string
              required:
              - 'schema:additionalType'
              - 'schema:name'
          required:
          - 'schema:instrument'
      - description: >-
          Must contain a prov:used entry whose schema:instrument is classified
          as an xas:xraymonochromator (via schema:additionalType) and
          has a schema:additionalProperty carrying the
          xas:dspacing PropertyValue with a schema:value.
        contains:
          type: object
          properties:
            'schema:instrument':
              type: object
              properties:
                'schema:additionalType':
                  anyOf:
                  - type: object
                    additionalProperties: false
                    required:
                    - '@id'
                    properties:
                      '@id':
                        const: 'xas:xraymonochromator'
                  - type: array
                    contains:
                      type: object
                      additionalProperties: false
                      required:
                      - '@id'
                      properties:
                        '@id':
                          const: 'xas:xraymonochromator'
                'schema:additionalProperty':
                  type: array
                  contains:
                    type: object
                    properties:
                      'schema:propertyID':
                        type: array
                        contains:
                          type: object
                          additionalProperties: false
                          required:
                          - '@id'
                          properties:
                            '@id':
                              const: xas:dspacing
                      'schema:value':
                        type: string
                    required:
                    - 'schema:propertyID'
                    - 'schema:value'
              required:
              - 'schema:additionalType'
              - 'schema:additionalProperty'
          required:
          - 'schema:instrument'
    'schema:additionalProperty':
      type: array
      description: >-
        Additional properties on the XAS analysis activity (base
        AdditionalProperty shape). The activity-level propertyID enum
        (xas:edgeenergy, calibration method, ...) is layered on in
        xasOptional so it applies at the profile level, not this shape.
      items:
        $ref: '#/$defs/AdditionalProperty'
    'schema:location':
      $ref: '#/$defs/Facility'
    'schema:object':
      description: Sample being analyzed (per Ocean Info Hub recommendation)
      $ref: '#/$defs/Sample'
$defs:
  Identifier:
    $ref: ../../schemaorgProperties/identifier/schema.yaml
  Sample:
    $ref: ../xasSample/schema.yaml
  AdditionalProperty:
    $ref: ../../schemaorgProperties/additionalProperty/schema.yaml
  Facility:
    $ref: ../xasFacility/schema.yaml
  Instrument:
    allOf:
    - $ref: ../xasInstrument/schema.yaml
    - type: object
      description: >-
        As a prov:used entity, the instrument's @type includes prov:Entity
        (the PROV-O range of prov:used) alongside schema:Thing / schema:Product.
      properties:
        '@type':
          contains:
            const: prov:Entity
