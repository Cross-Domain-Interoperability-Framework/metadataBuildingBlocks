---
$schema: https://json-schema.org/draft/2020-12/schema
title: XAS Analysis Event activity
description: XAS-specific provenance activity building block. Extends cdifProvActivity with
  XAS analysis event typing (xas:analysisevent), XAS facility location,
  sample object, XAS-specific instrument type, and XAS additional properties
  (edge_energy, calibration method, instrument configuration, installedOptions).
allOf:
- $ref: ../../cdifDataType/cdifProvActivity/schema.yaml
- type: object
  required:
  - 'schema:additionalType'
  properties:
    '@type':
      type: array
      items:
        type: string
    'schema:additionalType':
      description: Domain type(s) for the activity; must include xas:analysisevent (an XAS analysis event).
      type: array
      items:
        $ref: '#/$defs/cdifConceptOrTermOrString'
      contains:
        type: object
        additionalProperties: false
        required:
        - '@id'
        properties:
          '@id':
            const: xas:analysisevent
    # startTime/endTime, not startDate: schema.org gives startDate to
    # Event and CreativeWork, and this subject is a schema:Action. The
    # core cdifProvActivity shape asks for these two by name.
    'schema:startTime':
      type: string
      description: Date/time the XAS analysis started
    'schema:endTime':
      type: string
      description: Date/time the XAS analysis finished
    'schema:instrument':
      type: array
      items:
        anyOf:
        - $ref: ../../cdifDataType/objectReference/schema.yaml
        - $ref: '#/$defs/Instrument'
      allOf:
      - description: >-
          Must contain a schema:instrument item classified as an NXinstrument (via schema:additionalType) and carries a schema:name (the beamline name).
        contains:
          type: object
          properties:
            'schema:additionalType':
              type: array
              contains:
                type: object
                additionalProperties: false
                required:
                - '@id'
                properties:
                  '@id':
                    # Transition: the NeXus term is preferred and the retired xas: term is still
                    # accepted. See CHANGES-from-UKDS.md for the retirement table. Remove the
                    # xas: alternative once cdifnexmetadata and XAS-CDIF emit the NeXus form.
                    enum:
                    - "nxs:base_classes/NXinstrument.html"
                    - "xas:beamline"
            'schema:name':
              type: string
          required:
          - 'schema:additionalType'
          - 'schema:name'
      - description: >-
          Must contain a schema:instrument item classified as an xas:xraymonochromator (via schema:additionalType) and has a schema:additionalProperty carrying the xas:dspacing PropertyValue with a schema:value.
        contains:
          type: object
          properties:
            'schema:additionalType':
              type: array
              contains:
                type: object
                additionalProperties: false
                required:
                - '@id'
                properties:
                  '@id':
                    const: 'xas:xraymonochromator'
            'schema:additionalProperty':
              type: array
              contains:
                type: object
                properties:
                  'schema:propertyID':
                    type: array
                    contains:
                      type: object
                      additionalProperties: false
                      required:
                      - '@id'
                      properties:
                        '@id':
                          const: xas:dspacing
                  'schema:value':
                    type: string
                required:
                - 'schema:propertyID'
                - 'schema:value'
          required:
          - 'schema:additionalType'
          - 'schema:additionalProperty'
    'schema:additionalProperty':
      type: array
      description: >-
        Additional properties on the XAS analysis activity (base
        AdditionalProperty shape). The activity-level propertyID enum
        (xas:edgeenergy, calibration method, ...) is layered on in
        xasOptional so it applies at the profile level, not this shape.
      items:
        $ref: '#/$defs/AdditionalProperty'
    'schema:location':
      $ref: '#/$defs/Facility'
    'schema:object':
      description: Sample being analyzed (per Ocean Info Hub recommendation)
      $ref: '#/$defs/Sample'
$defs:
  cdifConceptOrTermOrString:
    $ref: ../../cdifDataType/cdifConceptOrTermOrString/schema.yaml
  Identifier:
    $ref: ../../schemaorgProperties/identifier/schema.yaml
  Sample:
    $ref: ../xasSample/schema.yaml
  AdditionalProperty:
    $ref: ../../schemaorgProperties/additionalProperty/schema.yaml
  Facility:
    $ref: ../xasFacility/schema.yaml
  Instrument:
    $ref: ../xasInstrument/schema.yaml
