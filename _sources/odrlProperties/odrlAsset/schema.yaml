---
$schema: https://json-schema.org/draft/2020-12/schema
title: ODRL Asset
description: >-
  An ODRL 2.2 Asset (https://www.w3.org/TR/odrl-model/#asset) or AssetCollection
  (https://www.w3.org/TR/odrl-model/#asset-collection): the resource a rule applies to. In CDIF this is
  normally a distribution or data service, identified by its IRI. An AssetCollection groups assets:
  either the collection itself, identified by @id, or a subset of one, where odrl:source names the
  collection and odrl:refinement narrows it (e.g. the CSV distributions of a dataset).
type: object
properties:
  '@context':
    type: object
    description: JSON-LD namespace prefixes for ODRL properties.
    properties:
      odrl:
        const: "http://www.w3.org/ns/odrl/2/"
anyOf:
- $ref: '#/$defs/Asset'
- $ref: '#/$defs/AssetCollection'
$defs:
  Asset:
    type: object
    properties:
      '@type':
        type: array
        items:
          type: string
        contains:
          const: 'odrl:Asset'
      '@id':
        type: string
        format: iri
      'odrl:partOf':
        description: AssetCollections this asset is a member of.
        type: array
        items:
          $ref: ../../cdifDataType/objectReference/schema.yaml
    required:
    - '@type'
    - '@id'
  AssetCollection:
    description: >-
      Per ODRL, a refined collection is identified through odrl:source, so odrl:refinement requires
      odrl:source.
    type: object
    properties:
      '@type':
        type: array
        items:
          type: string
        contains:
          const: 'odrl:AssetCollection'
      '@id':
        type: string
        format: iri
      'odrl:source':
        description: The collection this one is drawn from.
        $ref: ../../cdifDataType/objectReference/schema.yaml
      'odrl:refinement':
        description: Constraints selecting the members of odrl:source that belong to this collection.
        type: array
        minItems: 1
        items:
          $ref: ../odrlConstraint/schema.yaml
    required:
    - '@type'
    anyOf:
    - required:
      - '@id'
    - required:
      - 'odrl:source'
    dependentRequired:
      'odrl:refinement':
      - 'odrl:source'
