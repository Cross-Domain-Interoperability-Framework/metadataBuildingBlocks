---
$schema: https://json-schema.org/draft/2020-12/schema
title: ODRL Constraint
description: >-
  An ODRL 2.2 Constraint (https://www.w3.org/TR/odrl-model/#constraint) or LogicalConstraint
  (https://www.w3.org/TR/odrl-model/#constraint-logical). A Constraint compares a left operand with a
  right operand using an operator, e.g. odrl:spatial odrl:eq <country>. A LogicalConstraint combines
  constraints with exactly one of odrl:and, odrl:or, odrl:xone or odrl:andSequence. Operands and
  operators are open IRIs (odrlTerms), so ODRL profile terms validate.
type: object
properties:
  '@context':
    type: object
    description: JSON-LD namespace prefixes for ODRL properties.
    properties:
      odrl:
        const: "http://www.w3.org/ns/odrl/2/"
anyOf:
- $ref: '#/$defs/Constraint'
- $ref: '#/$defs/LogicalConstraint'
$defs:
  Constraint:
    type: object
    properties:
      '@id':
        description: Optional; needed when a LogicalConstraint refers to this constraint by reference.
        type: string
        format: iri
      '@type':
        type: array
        items:
          type: string
        contains:
          const: 'odrl:Constraint'
      'odrl:leftOperand':
        $ref: ../odrlTerms/schema.yaml#/$defs/LeftOperand
      'odrl:operator':
        $ref: ../odrlTerms/schema.yaml#/$defs/Operator
      'odrl:rightOperand':
        description: A literal, a value object ({"@value", "@type"}) or an {@id} reference.
      'odrl:rightOperandReference':
        description: An IRI whose dereferenced value is the right operand.
        $ref: ../../cdifDataType/objectReference/schema.yaml
      'odrl:dataType':
        description: Datatype of the right operand, e.g. xsd:decimal.
        $ref: ../../cdifDataType/objectReference/schema.yaml
      'odrl:unit':
        description: Unit of the right operand, e.g. a currency or unit of measure.
        $ref: ../../cdifDataType/objectReference/schema.yaml
      'odrl:status':
        description: The current value of the left operand, for comparison with the right operand.
    required:
    - 'odrl:leftOperand'
    - 'odrl:operator'
    anyOf:
    - required:
      - 'odrl:rightOperand'
    - required:
      - 'odrl:rightOperandReference'
  LogicalConstraint:
    type: object
    properties:
      '@id':
        type: string
        format: iri
      '@type':
        type: array
        items:
          type: string
        contains:
          const: 'odrl:LogicalConstraint'
      'odrl:and':
        description: All of the constraints must be satisfied.
        $ref: '#/$defs/constraintList'
      'odrl:or':
        description: At least one of the constraints must be satisfied.
        $ref: '#/$defs/constraintList'
      'odrl:xone':
        description: Exactly one of the constraints must be satisfied.
        $ref: '#/$defs/constraintList'
      'odrl:andSequence':
        description: All of the constraints must be satisfied, in order.
        $ref: '#/$defs/constraintList'
    oneOf:
    - required:
      - 'odrl:and'
    - required:
      - 'odrl:or'
    - required:
      - 'odrl:xone'
    - required:
      - 'odrl:andSequence'
  constraintList:
    description: >-
      The operand constraints, as an RDF list ({"@list": [...]}), each inline or an {@id} reference.
    type: object
    properties:
      '@list':
        type: array
        minItems: 1
        items:
          anyOf:
          - $ref: ../../cdifDataType/objectReference/schema.yaml
          - $ref: '#/$defs/Constraint'
    required:
    - '@list'
