---
$schema: https://json-schema.org/draft/2020-12/schema
title: ODRL Party
description: >-
  An ODRL 2.2 Party (https://www.w3.org/TR/odrl-model/#party) or PartyCollection
  (https://www.w3.org/TR/odrl-model/#party-collection): who takes a role (assigner, assignee) in a rule.
  A Party is a person, organization or agent identified by its IRI. A PartyCollection is a group of
  parties: either the collection itself, identified by @id, or a subset of one, where odrl:source names
  the collection and odrl:refinement narrows it (e.g. registered users located in the UK).
type: object
properties:
  '@context':
    type: object
    description: JSON-LD namespace prefixes for ODRL properties.
    properties:
      odrl:
        const: "http://www.w3.org/ns/odrl/2/"
anyOf:
- $ref: '#/$defs/Party'
- $ref: '#/$defs/PartyCollection'
$defs:
  Party:
    description: Further description (e.g. schema:name) is allowed.
    type: object
    properties:
      '@type':
        type: array
        items:
          type: string
        contains:
          const: 'odrl:Party'
      '@id':
        type: string
        format: iri
    required:
    - '@type'
    - '@id'
  PartyCollection:
    description: >-
      Per ODRL, a refined collection is identified through odrl:source, so odrl:refinement requires
      odrl:source.
    type: object
    properties:
      '@type':
        type: array
        items:
          type: string
        contains:
          const: 'odrl:PartyCollection'
      '@id':
        type: string
        format: iri
      'odrl:source':
        description: The collection this one is drawn from.
        $ref: ../../cdifDataType/objectReference/schema.yaml
      'odrl:refinement':
        description: Constraints selecting the members of odrl:source that belong to this collection.
        type: array
        minItems: 1
        items:
          $ref: ../odrlConstraint/schema.yaml
    required:
    - '@type'
    anyOf:
    - required:
      - '@id'
    - required:
      - 'odrl:source'
    dependentRequired:
      'odrl:refinement':
      - 'odrl:source'
