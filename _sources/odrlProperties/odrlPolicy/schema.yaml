---
$schema: https://json-schema.org/draft/2020-12/schema
title: ODRL Policy
description: >-
  An ODRL 2.2 Policy (https://www.w3.org/TR/odrl-model/#policy): a group of permissions, prohibitions and
  obligations, typed by one of its subclasses: Set (the default), Offer, Agreement, Request, Ticket,
  Assertion or Privacy. A target or party given at policy level applies to every rule
  (https://www.w3.org/TR/odrl-model/#composition), so each subclass requirement below is met by the
  policy-level property or by that property on every rule concerned. The subclass requirements are
  those stated in the ODRL vocabulary (https://www.w3.org/ns/odrl/2/ODRL22.ttl); requirements on
  meaning (e.g. an Offer grants no privileges to an assignee) cannot be checked by a schema.
type: object
properties:
  '@context':
    type: object
    description: JSON-LD namespace prefixes for ODRL properties.
    properties:
      odrl:
        const: "http://www.w3.org/ns/odrl/2/"
  '@id':
    description: Globally unique IRI for the policy (ODRL uid).
    type: string
    format: iri
  '@type':
    type: array
    items:
      type: string
    contains:
      enum:
      - 'odrl:Policy'
      - 'odrl:Set'
      - 'odrl:Offer'
      - 'odrl:Agreement'
      - 'odrl:Request'
      - 'odrl:Ticket'
      - 'odrl:Assertion'
      - 'odrl:Privacy'
  'odrl:profile':
    description: ODRL profiles the policy conforms to.
    anyOf:
    - $ref: ../../cdifDataType/objectReference/schema.yaml
    - type: array
      items:
        $ref: ../../cdifDataType/objectReference/schema.yaml
  'odrl:inheritFrom':
    description: Parent policies whose rules this policy inherits.
    anyOf:
    - $ref: ../../cdifDataType/objectReference/schema.yaml
    - type: array
      items:
        $ref: ../../cdifDataType/objectReference/schema.yaml
  'odrl:conflict':
    $ref: ../odrlTerms/schema.yaml#/$defs/ConflictTerm
  'odrl:target':
    $ref: ../odrlRule/schema.yaml#/$defs/Target
  'odrl:assigner':
    $ref: ../odrlRule/schema.yaml#/$defs/PartyRef
  'odrl:assignee':
    $ref: ../odrlRule/schema.yaml#/$defs/PartyRef
  'odrl:permission':
    type: array
    items:
      $ref: ../odrlRule/schema.yaml#/$defs/Permission
  'odrl:prohibition':
    type: array
    items:
      $ref: ../odrlRule/schema.yaml#/$defs/Prohibition
  'odrl:obligation':
    type: array
    items:
      $ref: ../odrlRule/schema.yaml#/$defs/Duty
required:
- '@type'
- '@id'
anyOf:
- required:
  - 'odrl:permission'
- required:
  - 'odrl:prohibition'
- required:
  - 'odrl:obligation'
allOf:
- if:
    $ref: '#/$defs/isSet'
  then:
    allOf:
    - $ref: '#/$defs/hasTarget'
- if:
    $ref: '#/$defs/isOffer'
  then:
    allOf:
    - $ref: '#/$defs/hasPermissionOrProhibition'
    - $ref: '#/$defs/hasAssigner'
- if:
    $ref: '#/$defs/isAgreement'
  then:
    allOf:
    - $ref: '#/$defs/hasPermissionOrProhibition'
    - $ref: '#/$defs/hasAssigner'
    - $ref: '#/$defs/hasAssignee'
- if:
    $ref: '#/$defs/isRequest'
  then:
    allOf:
    - $ref: '#/$defs/hasPermissionOrProhibition'
    - $ref: '#/$defs/hasTarget'
    - $ref: '#/$defs/hasAssignee'
- if:
    $ref: '#/$defs/isTicket'
  then:
    allOf:
    - $ref: '#/$defs/hasPermissionOrProhibition'
    - $ref: '#/$defs/hasTarget'
    - $ref: '#/$defs/noAssignee'
- if:
    $ref: '#/$defs/isAssertion'
  then:
    allOf:
    - $ref: '#/$defs/hasPermissionOrProhibition'
    - $ref: '#/$defs/hasTarget'
    - anyOf:
      - $ref: '#/$defs/hasAssigner'
      - $ref: '#/$defs/hasAssignee'
- if:
    $ref: '#/$defs/isPrivacy'
  then:
    allOf:
    - $ref: '#/$defs/hasPermissionOrProhibition'
    - $ref: '#/$defs/hasTarget'
    - $ref: '#/$defs/hasAssigner'
    - $ref: '#/$defs/hasAssignee'
    - description: The rules must include a duty describing obligations on the use of personal information.
      anyOf:
      - required:
        - 'odrl:obligation'
      - properties:
          'odrl:permission':
            contains:
              required:
              - 'odrl:duty'
        required:
        - 'odrl:permission'
$defs:
  isSet:
    properties:
      '@type':
        contains:
          const: 'odrl:Set'
    required:
    - '@type'
  isOffer:
    properties:
      '@type':
        contains:
          const: 'odrl:Offer'
    required:
    - '@type'
  isAgreement:
    properties:
      '@type':
        contains:
          const: 'odrl:Agreement'
    required:
    - '@type'
  isRequest:
    properties:
      '@type':
        contains:
          const: 'odrl:Request'
    required:
    - '@type'
  isTicket:
    properties:
      '@type':
        contains:
          const: 'odrl:Ticket'
    required:
    - '@type'
  isAssertion:
    properties:
      '@type':
        contains:
          const: 'odrl:Assertion'
    required:
    - '@type'
  isPrivacy:
    properties:
      '@type':
        contains:
          const: 'odrl:Privacy'
    required:
    - '@type'
  hasPermissionOrProhibition:
    anyOf:
    - required:
      - 'odrl:permission'
    - required:
      - 'odrl:prohibition'
  hasTarget:
    description: A target at policy level, or on every rule.
    anyOf:
    - required:
      - 'odrl:target'
    - properties:
        'odrl:permission':
          items:
            required:
            - 'odrl:target'
        'odrl:prohibition':
          items:
            required:
            - 'odrl:target'
        'odrl:obligation':
          items:
            required:
            - 'odrl:target'
  hasAssigner:
    description: An assigner at policy level, or on every permission and prohibition.
    anyOf:
    - required:
      - 'odrl:assigner'
    - properties:
        'odrl:permission':
          items:
            required:
            - 'odrl:assigner'
        'odrl:prohibition':
          items:
            required:
            - 'odrl:assigner'
  hasAssignee:
    description: An assignee at policy level, or on every permission and prohibition.
    anyOf:
    - required:
      - 'odrl:assignee'
    - properties:
        'odrl:permission':
          items:
            required:
            - 'odrl:assignee'
        'odrl:prohibition':
          items:
            required:
            - 'odrl:assignee'
  noAssignee:
    description: A Ticket names no assignee; it is granted to whoever holds it.
    not:
      anyOf:
      - required:
        - 'odrl:assignee'
      - properties:
          'odrl:permission':
            contains:
              required:
              - 'odrl:assignee'
        required:
        - 'odrl:permission'
      - properties:
          'odrl:prohibition':
            contains:
              required:
              - 'odrl:assignee'
        required:
        - 'odrl:prohibition'
