$schema: https://json-schema.org/draft/2020-12/schema
description: For more granularity on how a person contributed to a Dataset, use schema:Role. The schema.org
  documentation does not state that the Role type is an expected data type of author, creator and contributor,
  but that is addressed in this blog post (http://blog.schema.org/2014/06/introducing-role.html). see
  https://github.com/ESIPFed/science-on-schema.org/blob/develop/guides/Dataset.md#roles-of-people.
  The Role holds the agent under the property it sits under, as schema.org's Role pattern and
  validator.schema.org require -- schema:contributor inside a contributor Role, schema:agent inside an
  activity's agent Role, schema:participant inside a participant Role. At least one is required.
type: object
properties:
  '@type':
    default: ['schema:Role']
    type: array
    items:
      type: string
    contains:
      const: schema:Role
    minItems: 1
  'schema:roleName':
    $ref: '#/$defs/cdifConceptOrTermOrString'
  'schema:contributor':
    $ref: '#/$defs/RoleFiller'
  'schema:agent':
    $ref: '#/$defs/RoleFiller'
  'schema:participant':
    $ref: '#/$defs/RoleFiller'
required:
  - '@type'
  - 'schema:roleName'
anyOf:
  - required: ['schema:contributor']
  - required: ['schema:agent']
  - required: ['schema:participant']
$defs:
  RoleFiller:
    description: The Person or Organization in this role.
    anyOf:
      - description: "IRI reference to a Person or Organization defined elsewhere"
        $ref: ../../cdifDataType/objectReference/schema.yaml
      - $ref: ../person/schema.yaml
      - $ref: ../organization/schema.yaml
  cdifConceptOrTermOrString:
    $ref: ../../cdifDataType/cdifConceptOrTermOrString/schema.yaml
