- title: Complete temporal extent example.
  content: |-
    Temporal extent instance exercising all properties across the ordinal era
    and numeric age options: description, intervalStartedBy, intervalFinishedBy,
    hasBeginning/hasEnd with TimePosition (hasTRS, numericPosition).
  prefixes:
    schema: http://schema.org/
    time: http://www.w3.org/2006/time#
  snippets:
    - language: json
      ref: exampleTemporalExtentComplete.json

- title: Calendar-date temporal extent with a description.
  content: |-
    A proper interval with calendar date bounds (time:inXSDDate), the object form
    of an ISO 8601 interval such as 2008-07-15/2011-07-15, carrying a description.
    From NICHD DASH record nichd_dash_dataset_1132, as the NIAID Data Discovery
    Portal gives it: a collection period, described by its nde:temporalType.
  prefixes:
    schema: http://schema.org/
    time: http://www.w3.org/2006/time#
  snippets:
    - language: json
      ref: exampleTemporalExtentCalendar.json
