$schema: https://json-schema.org/draft/2020-12/schema
description: |
  schema.org Defined Term schema.

  **Union-type policy:** In CDIF profile UML models an attribute typed as
  schema:DefinedTerm is represented by a single attribute of that class type.
  The JSON Schema implementation permits the property value to be EITHER a
  plain string (interpreted as schema:name or schema:termCode in the default
  vocabulary) OR a full schema:DefinedTerm object (with explicit @type, name,
  identifier, termCode, inDefinedTermSet). Consumers should accept either form.

  Note that this differs from the cdif Concept policy: a Concept (skos:Concept)
  in CDIF profiles MUST be a controlled-vocabulary entry (object form or
  @id-reference) — plain strings are not permitted for Concept-typed values
  because vocabulary identity cannot be recovered from an unscoped label.
type: object
properties:
  '@type':
    type: array
    items:
      type: string
    contains:
      const: schema:DefinedTerm
    minItems: 1
  'schema:name':
    type: string
    description: text label for the term that is useful to human user
  'schema:identifier':
    anyOf:
      - type: string
      - $ref: '../identifier/schema.yaml'
  'schema:inDefinedTermSet':
    description: >-
      The controlled vocabulary responsible for this keyword, as EITHER a plain URI string
      identifying the vocabulary, OR an object reference ({"@id": "<uri>"}) to a vocabulary defined
      elsewhere in the document. Both forms are already in use across CDIF profiles and downstream
      ADA building blocks; permitting only the string form made the object form - the natural
      JSON-LD spelling of a reference - invalid, while this class's own union-type policy above
      explicitly anticipates both.
    anyOf:
      - type: string
      - $ref: ../../cdifDataType/objectReference/schema.yaml
  'schema:termCode':
    type: string
    description: A representative code for this keyword in the controlled vocabulary. Analogous
      to skos:Notation
  'schema:about':
    description: >-
      What this term is about, or the part it plays in the record, as EITHER a plain string OR an
      object reference ({"@id": "<uri>"}). schema.org lists schema:DefinedTerm in the domain of
      schema:about. In CDIF records it marks where a keyword came from when that is not the
      dataset's own description: for example 'DCATtheme' for a keyword taken from dcat:theme, or
      'portal level value' for one that describes the source portal and not the dataset.
    anyOf:
      - type: string
      - $ref: ../../cdifDataType/objectReference/schema.yaml

allOf:
  - required: 
    - '@type'
  - anyOf:
    - required:
      - 'schema:name'
    - required:
      - 'schema:identifier'
    - required:
      - 'schema:termCode'